# Settlement Input Manifest — F5 Phase 5A.1
# Status: Draft — initial pass. Escrow + ledger entries pending Agents D + E.
# Commit: 51bce89 (F4-frozen, tag f4-complete-selection-race-closed-pending-f5).
# Date: 2026-04-23
# Plan reference: F5 Phase 5A Plan v3 §3.1.
#
# Consumer contract between phases (plan v3 §3.1, Finding 9):
# - Phase 5B derivation consumes `target_classification`, `target_retrieval_mode`,
#   and `derived_source` as the implementation target.
# - `classification`, `retrieval_mode`, and `legacy_source` are the audit baseline
#   that Phase 5D regression detection compares against. Any deviation from these
#   baseline facts in 5B indicates a 5A audit miss.
#
# Classification taxonomy (plan v3 §3.1):
#   canonical-frozen       — fixed at round-seal, does not change. Permitted.
#   canonical-live         — canonical source, may change after round-seal.
#                            Permitted IFF retrieval_mode defined + Input-Domain-4 satisfiable.
#   canonical-derived      — deterministic from canonicalized inputs. Permitted.
#   non-canonical-artifact — process-local representation. Forbidden in derivation meaning.
#   local-live             — mutable local state not sourced from canonical. Forbidden.
#   advisory               — event payload fields, diagnostics only.
#
# Retrieval modes (plan v3 §3.1):
#   inline-on-round        — data in round struct, O(1).
#   canonical-projection   — read from named canonical projection at cutoff.
#   replay-derived         — recomputed from canonical event stream up to cutoff.
#   mutable-store-read     — reads mutable in-memory/on-disk store that accepts writes.
#   not-yet-available      — no retrieval mechanism exists; 5A must propose one or forbid.
#
# Semantic role classification (added at Gate 5A.1 closure post multi-AI review):
#   derivation               — input feeds into canonical payout computation
#   control-flow-idempotency — input gates control flow; does NOT influence canonical
#                              effect because end-state is idempotent under pure derivation.
#                              Formally exempt from Input-Domain-4. Each such row carries
#                              a proof_obligation field stating the 5B guarantee that
#                              must hold for the exemption to be valid.
#   observability            — input is for diagnostics/metrics; no semantic effect.

# Semantic-role assignments (every in-scope row classified per Gate 5A.1 closure
# direction). Per-row notes on control-flow-idempotency rows include explicit
# proof_obligation field below.

semantic_role_assignments:
  derivation:
    - round_votes
    - round_category
    - payload_task_id
    - payload_worker_id
    - payload_poster_id
    - payload_submission_event_id
    - payload_final_verdict       # advisory but currently used in routing switch; 5B redirects to Outcome.Verdict
    - payload_final_score_bp      # advisory but currently passed to ApplyVerificationConsensusResolution; 5B redirects to Outcome.ScoreBP
    - task_poster_id
    - task_budget
    - escrow_entry_amount
    - escrow_entry_task_id
    - escrow_entry_poster_id
    - validator_q_score
    - quality_fn
    - dag_event_lookup
    - ancestor_event_causal_refs
    - worker_share_bp
    - validator_share_bp
    - generation_share_bp
    - treasury_share_bp
    - generation_ledger_max_depth
    - treasury_id
    - shadow_mode               # currently affects derivation; removed post-excision
    - float_path_result         # currently affects derivation; removed post-excision
    - active_weight             # pre-settlement admission guard; derivation-shape input to seal decision
    - bucket_counter            # currently affects ID; removed/refactored in 5A.4
    - synthetic_transfer_id     # currently non-deterministic; refactored to canonical-derived in 5A.4
    - valid_ledger_transitions  # state-transition table is canonical
  control-flow-idempotency:
    - task_status               # proof_obligation in row notes
    - applicator_applied_set    # proof_obligation in row notes
    - escrow_entry_paid_flags   # proof_obligation in row notes (Finding 6 disposition)
    - escrow_has_settlement_started  # proof_obligation in row notes
    - escrow_entries_map        # in-memory cache supporting idempotency lookups
    - ledger_settle_lock        # atomic-barrier mechanism for Settle()
  observability:
    - payload_finalization_time_unix  # advisory wall-clock, never read by settler
    - time_now_recorded_at            # wall-clock at TransferEntry creation; not in balance arithmetic

