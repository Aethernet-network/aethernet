    target_classification: canonical-live
    retrieval_mode: mutable-store-read
    target_retrieval_mode: mutable-store-read  # formally exempt from Input-Domain-4 (Gate 5A.1)
    treatment: accepted-as-idempotency-pattern (architect decision §9.2 — Gate 5A.1)
    proof_obligation: |
      5B MUST guarantee the early-exit path (task.Status terminal → AlreadyApplied=true →
      return) produces ledger-state indistinguishable from the full derivation + apply
      path. Terminal status implies canonical payout record already fully materialized
      on the cluster. No canonical artifact emission is suppressed by early-exit that
      another node would emit. If 5B's derivation produces per-node-rather-than-cluster-
      uniform canonical artifacts, the early-exit path must reconstruct them.
    notes: |
      Architect decision (Gate 5A.1, §9.2): task.Status classified canonical-live with
      retrieval_mode = mutable-store-read; accepted because the downstream effect is
      idempotent under pure derivation. The read is for early-exit optimization (terminal-
      state short-circuit at verification_consensus_settler.go:146-150). Under 5B's pure
      derivation, the end-state is deterministic from canonical inputs regardless of
      control-flow divergence; if Node A short-circuits and Node B proceeds, both reach
      the same canonical ledger effect.

      Gate 5A.1 closure (post multi-AI review): formally exempted from Input-Domain-4
      via semantic_role = control-flow-idempotency classification. The proof_obligation
      field above is the precondition that makes the exemption valid.

      REOPEN CONDITION: this decision reopens if 5B discovers that task.Status influences
      PAYOUT MATH (e.g., a code path where status affects amount calculations or
      recipient set), not just the short-circuit branch. If reopened, the canonicalization
      target reverts to anchor-scoped task-status projection (option a).
    legacy_source: taskMgr.Get (mutable projection)
    derived_source: same (architect-accepted)
    available_pre_gate: true
    available_post_gate: true
    replay_behavior: replays-from-canonical-events; idempotent end-state
    mixed_version_risk: low  # idempotency-bounded
    downstream: [Settle idempotency branch — short-circuit only, NOT payout math]

