    target_classification: canonical-live
    retrieval_mode: mutable-store-read
    target_retrieval_mode: canonical-projection
    treatment: canonicalize-via-Q-C
    notes: |
      LOAD-BEARING FINDING (§4.1). Reads BadgerDB per-node with async RecordVote
      updates. Cross-node divergence at same round cutoff is confirmed possible
      (see audit doc §4.1 for divergence arithmetic). Q-C design in 5A.2 introduces
      CanonicalQProjection with historical-read semantics at cutoff anchor, parallel
      to the existing advisory reputation projection.

      Gate 5A.1 closure (post multi-AI review): mixed_version_risk UPGRADED to HIGH.
      Rationale: cross-cluster divergence at projection-version mismatch is a load-
      bearing failure mode, not a transitional concern. 5A.2 deliverable item 7
      (version-binding rule) makes the projection schema/version part of gate
      semantics, NOT an implicit binary detail. Two nodes with different projection
      versions reading the "same" cutoff anchor return well-defined behavior (either
      both succeed at the same version-bound value, or one returns an explicit
      version-mismatch error). Mixed-version cluster operation is impossible by
      design under the version-binding rule.
    legacy_source: tvReputationStore.ValidatorQScore (mutable BadgerDB)
    derived_source: CanonicalQProjection.Lookup(validator, category, cutoff_anchor)
    available_pre_gate: true  # via legacy
    available_post_gate: true  # via canonical projection
    replay_behavior: canonical-projection-replays-from-canonical-evidence
    mixed_version_risk: HIGH  # upgraded at Gate 5A.1 closure; projection-version-binding required
    downstream: [computeValidatorPayoutsFloat, computeValidatorPayoutsInteger]

