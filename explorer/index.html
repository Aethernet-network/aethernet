<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AetherNet Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: hsl(220, 52%, 9%);
      --fg: hsl(216, 43%, 93%);
      --primary: hsl(220, 100%, 59%);
      --secondary: hsl(207, 100%, 62%);
      --card: hsl(220, 48%, 13%);
      --muted: hsl(218, 37%, 16%);
      --muted-fg: hsl(216, 15%, 49%);
      --border: hsl(218, 37%, 16%);
      --destructive: hsl(0, 84%, 60%);
      --success: #10b981;
      --warn: #f59e0b;
      --heading: 'Space Grotesk', sans-serif;
      --body: 'Inter', -apple-system, system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
      --radius: 8px;
    }
    body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }
    .mono { font-family: var(--mono); font-feature-settings: 'tnum'; }
    .heading { font-family: var(--heading); }

    /* Header */
    .header { position: sticky; top: 0; z-index: 30; border-bottom: 1px solid var(--border); background: hsla(220, 52%, 9%, 0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .header-inner { display: grid; grid-template-columns: auto 1fr auto; align-items: center; max-width: 1400px; margin: 0 auto; padding: 0 2rem; height: 56px; }
    .logo-btn { display: flex; align-items: center; gap: 10px; background: none; border: none; cursor: pointer; color: var(--fg); font-weight: 600; font-size: 16px; font-family: var(--heading); padding: 0; letter-spacing: -0.01em; }
    .header-nav { display: flex; align-items: center; justify-content: center; height: 100%; }
    .nav-link { background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; padding: 0 18px; height: 100%; display: flex; align-items: center; font-size: 14px; font-weight: 400; color: var(--muted-fg); font-family: var(--body); transition: color 0.15s; }
    .nav-link:hover { color: var(--fg); }
    .nav-link.active { color: var(--fg); font-weight: 500; border-bottom-color: var(--primary); }

    /* Layout */
    .container { max-width: 1400px; margin: 0 auto; padding: 0 2rem; width: 100%; }
    .page-wrap { padding: 2rem 0; flex: 1; }

    /* Cards */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }

    /* Tables */
    table { border-collapse: collapse; width: 100%; }
    th { text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-fg); border-bottom: 1px solid var(--border); white-space: nowrap; font-family: var(--body); }
    td { padding: 0 16px; font-size: 13px; color: var(--fg); border-bottom: 1px solid hsla(218, 37%, 16%, 0.5); height: 46px; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.1s; }
    tbody tr:hover td { background: hsla(220, 48%, 13%, 0.5); }

    /* Forms */
    .input { background: var(--muted); border: 1px solid var(--border); border-radius: 6px; color: var(--fg); padding: 8px 12px; width: 100%; font-size: 14px; font-family: var(--body); outline: none; transition: border-color 0.15s; }
    .input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 1px var(--primary); }
    .input::placeholder { color: var(--muted-fg); }
    textarea.input { resize: vertical; }
    select.input { appearance: none; cursor: pointer; }
    .field-label { font-size: 12px; font-weight: 500; color: var(--muted-fg); display: block; margin-bottom: 6px; }

    /* Buttons */
    .btn-primary { background: var(--primary); color: #fff; font-weight: 600; padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; border: none; font-family: var(--body); transition: filter 0.15s; display: inline-flex; align-items: center; justify-content: center; height: 40px; }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.1); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--fg); font-weight: 500; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid var(--border); font-family: var(--body); transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; }
    .btn-ghost:hover { background: var(--muted); border-color: var(--muted-fg); }
    .btn-outline { background: transparent; color: var(--primary); font-weight: 500; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid var(--primary); font-family: var(--body); transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; }
    .btn-outline:hover { background: hsla(220, 100%, 59%, 0.1); }
    .btn-danger { background: transparent; color: var(--destructive); font-weight: 500; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid hsla(0, 84%, 60%, 0.3); font-family: var(--body); transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; }
    .btn-danger:hover { background: hsla(0, 84%, 60%, 0.08); }

    /* Status dots */
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .dot-green { background: var(--success); }
    .dot-blue { background: var(--primary); }
    .dot-amber { background: var(--warn); }
    .dot-red { background: var(--destructive); }
    .dot-gray { background: var(--muted-fg); }

    /* Status pills */
    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 100px; }
    .pill-green { background: hsla(160, 84%, 39%, 0.12); color: var(--success); }
    .pill-blue { background: hsla(220, 100%, 59%, 0.12); color: var(--secondary); }
    .pill-amber { background: hsla(38, 92%, 50%, 0.12); color: var(--warn); }
    .pill-red { background: hsla(0, 84%, 60%, 0.12); color: var(--destructive); }
    .pill-gray { background: hsla(216, 15%, 49%, 0.12); color: var(--muted-fg); }

    /* Lane badges */
    .lane-badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 4px; letter-spacing: 0.02em; }
    .lane-std { background: hsla(220, 100%, 59%, 0.1); color: var(--secondary); }
    .lane-high { background: hsla(160, 84%, 39%, 0.1); color: var(--success); }
    .lane-ent { background: hsla(270, 76%, 65%, 0.1); color: #a78bfa; }
    .lane-none { background: hsla(216, 15%, 49%, 0.08); color: var(--muted-fg); }

    /* Wallet drawer */
    .wallet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .wallet-overlay.open { opacity: 1; pointer-events: auto; }
    .wallet-drawer { position: fixed; top: 0; right: 0; width: 360px; height: 100%; background: var(--card); border-left: 1px solid var(--border); z-index: 50; transform: translateX(100%); transition: transform 0.2s ease; display: flex; flex-direction: column; overflow: hidden; }
    .wallet-drawer.open { transform: translateX(0); }
    .wtab { flex: 1; text-align: center; font-size: 12px; font-weight: 500; padding: 10px 4px; cursor: pointer; color: var(--muted-fg); border-bottom: 2px solid transparent; background: none; border-top: none; border-left: none; border-right: none; font-family: var(--body); transition: color 0.15s; }
    .wtab:hover { color: var(--fg); }
    .wtab.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* Toast */
    .toast-wrap { position: fixed; bottom: 16px; right: 16px; z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
    .toast { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--border); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; max-width: 320px; color: var(--fg); }
    .toast-s { border-left-color: var(--success); }
    .toast-e { border-left-color: var(--destructive); }
    .toast-i { border-left-color: var(--primary); }

    /* Skeleton */
    .skel { background: linear-gradient(90deg, var(--muted) 25%, hsl(218, 37%, 20%) 50%, var(--muted) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Filter bar */
    .filter-bar { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 16px; }
    .filter-bar input { background: none; border: none; color: var(--fg); font-size: 14px; font-family: var(--body); outline: none; flex: 1; min-width: 0; }
    .filter-bar input::placeholder { color: var(--muted-fg); }
    .filter-pill { background: none; border: none; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--muted-fg); padding: 4px 10px; border-radius: 4px; font-family: var(--body); transition: all 0.15s; white-space: nowrap; }
    .filter-pill:hover { color: var(--fg); }
    .filter-pill.active { color: var(--primary); background: hsla(220, 100%, 59%, 0.1); }

    /* Notice */
    .notice { font-size: 13px; color: var(--warn); padding: 12px 16px; background: hsla(38, 92%, 50%, 0.06); border-radius: var(--radius); border: 1px solid hsla(38, 92%, 50%, 0.15); line-height: 1.5; }
    .notice-info { font-size: 13px; color: var(--muted-fg); padding: 12px 16px; background: hsla(220, 100%, 59%, 0.06); border-radius: var(--radius); border: 1px solid hsla(220, 100%, 59%, 0.12); line-height: 1.5; }

    /* KV list */
    .kv { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-bottom: 1px solid hsla(218, 37%, 16%, 0.6); }
    .kv:last-child { border-bottom: none; }

    /* Hero */
    .hero { position: relative; padding: 3rem 0 2.5rem; border-bottom: 1px solid var(--border); overflow: hidden; }
    .hero-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(47,107,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(47,107,255,.03) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; }

    /* Stat cards */
    .stat-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .stat-value { font-family: var(--mono); font-feature-settings: 'tnum'; font-size: 22px; font-weight: 500; color: var(--fg); line-height: 1.2; }
    .stat-label { font-size: 12px; font-weight: 500; color: var(--muted-fg); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.04em; }

    /* Section headers */
    .section-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border); }
    .section-title { font-size: 14px; font-weight: 600; color: var(--fg); font-family: var(--heading); }

    /* Responsive */
    @media (max-width: 1024px) {
      .stat-grid { grid-template-columns: repeat(3, 1fr); }
      .two-col, .col-2-1 { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 640px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .container { padding: 0 1rem; }
      .header-inner { padding: 0 1rem; }
      .header-nav { overflow-x: auto; scrollbar-width: none; justify-content: flex-start; }
      .header-nav::-webkit-scrollbar { display: none; }
      .nav-link { padding: 0 12px; font-size: 13px; flex-shrink: 0; }
      .wallet-drawer { width: 100%; }
      .filter-bar { flex-wrap: wrap; }
      .hero { padding: 2rem 0 1.5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skel { animation: none; }
      .wallet-drawer, .wallet-overlay { transition: none; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const API = window.location.origin;

async function apiFetch(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(`${r.status}`);
  return r.json();
}

async function apiPost(path, body) {
  const r = await fetch(API + path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || data.message || `${r.status}`);
  return data;
}

function fmtNum(n) {
  if (n == null) return '\u2014';
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}

function fmtAET(v) {
  if (!v) return '0 AET';
  const a = v / 1e6;
  if (a >= 1e6) return (a / 1e6).toFixed(2) + 'M AET';
  if (a >= 1e3) return (a / 1e3).toFixed(2) + 'K AET';
  return a.toFixed(a < 1 ? 4 : 2) + ' AET';
}

function truncate(s, n = 12) {
  if (!s) return '';
  return s.length > n * 2 ? s.slice(0, n) + '\u2026' + s.slice(-6) : s;
}

function dotClass(s) {
  return ({ open: 'dot-gray', claimed: 'dot-blue', submitted: 'dot-amber', completed: 'dot-green', disputed: 'dot-red', cancelled: 'dot-gray' })[s?.toLowerCase()] || 'dot-gray';
}

function pillClass(s) {
  return ({ open: 'pill-gray', claimed: 'pill-blue', submitted: 'pill-amber', completed: 'pill-green', disputed: 'pill-red', cancelled: 'pill-gray' })[s?.toLowerCase()] || 'pill-gray';
}

function statusLabel(s) {
  return ({ open: 'Open', claimed: 'In Progress', submitted: 'Review', completed: 'Settled', disputed: 'Disputed', cancelled: 'Cancelled' })[s?.toLowerCase()] || s || '\u2014';
}

function laneBadge(l) {
  if (!l) return { text: 'Unassured', cls: 'lane-none' };
  return ({ standard: { text: 'Standard', cls: 'lane-std' }, high_assurance: { text: 'High', cls: 'lane-high' }, enterprise: { text: 'Enterprise', cls: 'lane-ent' } })[l] || { text: l, cls: 'lane-none' };
}

function useToasts() {
  const [toasts, setToasts] = useState([]);
  const add = useCallback((msg, type = 'success') => {
    const id = Date.now() + Math.random();
    setToasts(p => [...p, { id, msg, type }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3500);
  }, []);
  return [toasts, add];
}

function Toasts({ toasts }) {
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div key={t.id} className={`toast ${t.type === 'success' ? 'toast-s' : t.type === 'error' ? 'toast-e' : 'toast-i'}`}>{t.msg}</div>
      ))}
    </div>
  );
}

function Skel({ w = '100%', h = 16 }) {
  return <div className="skel" style={{ width: w, height: h }} />;
}

function CopyId({ id, chars = 10 }) {
  const [ok, setOk] = useState(false);
  function copy() {
    navigator.clipboard.writeText(id).then(() => { setOk(true); setTimeout(() => setOk(false), 1500); });
  }
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
      <span className="mono" style={{ fontSize: 13, color: 'var(--fg)' }}>{truncate(id, chars)}</span>
      <button onClick={copy} style={{ background: 'none', border: 'none', cursor: 'pointer', color: ok ? 'var(--success)' : 'var(--muted-fg)', padding: 2, display: 'inline-flex' }} title="Copy full ID" aria-label="Copy agent ID">
        {ok ? (
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="20 6 9 17 4 12" /></svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" /></svg>
        )}
      </button>
    </span>
  );
}

function StatCard({ value, label }) {
  return (
    <div className="stat-card">
      <div className="stat-value">{value ?? <Skel w={60} h={26} />}</div>
      <div className="stat-label">{label}</div>
    </div>
  );
}

/* ── Wallet Panels ─────────────────────────────────────────────── */

function BalanceWidget({ agentId, refresh }) {
  const [bal, setBal] = useState(null);
  useEffect(() => {
    if (!agentId) return;
    apiFetch(`/v1/agents/${encodeURIComponent(agentId)}/balance`).then(d => setBal(d.balance ?? d)).catch(() => {});
  }, [agentId, refresh]);
  if (bal === null) return null;
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'var(--bg)', borderRadius: 6, padding: '10px 14px' }}>
      <span style={{ fontSize: 12, color: 'var(--muted-fg)' }}>Balance</span>
      <span className="mono" style={{ color: 'var(--primary)', fontWeight: 500, fontSize: 14 }}>{fmtAET(bal)}</span>
    </div>
  );
}

function IdentityPanel({ agent, setAgent, addToast }) {
  const [name, setName] = useState('');
  const [loading, setLoading] = useState(false);
  const [balRef, setBalRef] = useState(0);

  async function register() {
    setLoading(true);
    try {
      const raw = new Uint8Array(32);
      window.crypto.getRandomValues(raw);
      const pub = btoa(String.fromCharCode(...raw));
      const body = { public_key_b64: pub };
      if (name.trim()) body.agent_id = name.trim();
      const data = await apiPost('/v1/agents', body);
      const a = { agent_id: data.agent_id, pub_key_b64: pub, name: name.trim() };
      localStorage.setItem('aethernet_agent', JSON.stringify(a));
      setAgent(a);
      setName('');
      addToast(`Registered: ${truncate(data.agent_id, 10)}`, 'success');
    } catch (e) {
      addToast(`Registration failed: ${e.message}`, 'error');
    } finally {
      setLoading(false);
    }
  }

  if (agent) {
    return (
      <div style={{ padding: 20, display: 'flex', flexDirection: 'column', gap: 12 }}>
        <div style={{ fontSize: 11, fontWeight: 500, color: 'var(--muted-fg)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>Your Identity</div>
        <div style={{ background: 'var(--bg)', borderRadius: 6, padding: 14 }}>
          <div style={{ fontSize: 11, color: 'var(--muted-fg)', marginBottom: 4 }}>Agent ID</div>
          <div className="mono" style={{ fontSize: 12, color: 'var(--primary)', wordBreak: 'break-all', lineHeight: 1.5 }}>{agent.agent_id}</div>
          {agent.name && <div style={{ fontSize: 12, color: 'var(--muted-fg)', marginTop: 6 }}>Name: <span style={{ color: 'var(--fg)' }}>{agent.name}</span></div>}
        </div>
        <BalanceWidget agentId={agent.agent_id} refresh={balRef} />
        <button className="btn-ghost" style={{ width: '100%' }} onClick={() => setBalRef(n => n + 1)}>Refresh Balance</button>
        <button className="btn-danger" style={{ width: '100%' }} onClick={() => { localStorage.removeItem('aethernet_agent'); setAgent(null); addToast('Identity cleared', 'info'); }}>Clear Identity</button>
        <div className="notice-info">Identity is stored in browser localStorage. Copy your Agent ID to use with the SDK.</div>
      </div>
    );
  }

  return (
    <div style={{ padding: 20, display: 'flex', flexDirection: 'column', gap: 12 }}>
      <div style={{ fontSize: 11, fontWeight: 500, color: 'var(--muted-fg)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>Register on Testnet</div>
      <div className="notice-info">A 32-byte keypair is generated in your browser. Your public key becomes your identity on the testnet.</div>
      <div>
        <label className="field-label">Display name (optional)</label>
        <input className="input" placeholder="e.g. my-research-agent" value={name} onChange={e => setName(e.target.value)} onKeyDown={e => e.key === 'Enter' && register()} />
        <div style={{ fontSize: 11, color: 'var(--muted-fg)', marginTop: 4 }}>Leave blank to use hex(pubkey) as ID.</div>
      </div>
      <button className="btn-primary" style={{ width: '100%' }} onClick={register} disabled={loading}>{loading ? 'Registering\u2026' : 'Generate Keypair & Register'}</button>
    </div>
  );
}

function PostTaskPanel({ agent, addToast }) {
  const [title, setTitle] = useState('');
  const [desc, setDesc] = useState('');
  const [category, setCategory] = useState('');
  const [budget, setBudget] = useState('');
  const [posting, setPosting] = useState(false);

  async function postTask() {
    if (!agent) return addToast('Register an agent first', 'error');
    if (!title.trim()) return addToast('Title is required', 'error');
    const amt = parseInt(budget) || 100000;
    if (amt < 100000) return addToast('Minimum budget: 100,000 \u00b5AET (0.1 AET)', 'error');
    setPosting(true);
    try {
      await apiPost('/v1/tasks', { poster_id: agent.agent_id, title: title.trim(), description: desc.trim(), category: category || 'general', budget: amt });
      addToast('Task posted!', 'success');
      setTitle(''); setDesc(''); setCategory(''); setBudget('');
    } catch (e) { addToast(`Post failed: ${e.message}`, 'error'); }
    finally { setPosting(false); }
  }

  return (
    <div style={{ padding: 20, display: 'flex', flexDirection: 'column', gap: 12 }}>
      {!agent && <div className="notice">Register an agent (Identity tab) to post tasks.</div>}
      <div><label className="field-label">Title *</label><input className="input" placeholder="e.g. Summarise Q3 earnings report" value={title} onChange={e => setTitle(e.target.value)} /></div>
      <div><label className="field-label">Description</label><textarea className="input" rows={3} placeholder="Describe the task, deliverables, and acceptance criteria\u2026" value={desc} onChange={e => setDesc(e.target.value)} /></div>
      <div>

function MyTasksPanel({ agent, addToast }) {
  const [tab, setTab] = useState('posted');
  const [tasks, setTasks] = useState([]);
  const [loading, setLoading] = useState(false);
  const [submitId, setSubmitId] = useState(null);
  const [resultUri, setResultUri] = useState('');
  const [resultHash, setResultHash] = useState('');

  const load = useCallback(async () => {
    if (!agent) return;
    setLoading(true);
    try {
      const d = await apiFetch(`/v1/tasks/agent/${encodeURIComponent(agent.agent_id)}`);
      setTasks(Array.isArray(d) ? d : (d.tasks || []));
    } catch { addToast('Failed to load your tasks', 'error'); }
    finally { setLoading(false); }
  }, [agent, addToast]);

  useEffect(() => { load(); }, [load]);

  async function approve(id) {
    try { await apiPost(`/v1/tasks/${id}/approve`, { poster_id: agent.agent_id }); addToast('Approved \u2014 payment released!', 'success'); load(); }
    catch (e) { addToast(`Approve failed: ${e.message}`, 'error'); }
  }
  async function dispute(id) {
    try { await apiPost(`/v1/tasks/${id}/dispute`, { poster_id: agent.agent_id }); addToast('Task disputed.', 'info'); load(); }
    catch (e) { addToast(`Dispute failed: ${e.message}`, 'error'); }
  }
  async function submit(id) {
    try {
      await apiPost(`/v1/tasks/${id}/submit`, { claimer_id: agent.agent_id, result_uri: resultUri || 'ipfs://placeholder', result_hash: resultHash || `sha256:${Date.now().toString(16)}` });
      addToast('Result submitted!', 'success'); setSubmitId(null); setResultUri(''); setResultHash(''); load();
    } catch (e) { addToast(`Submit failed: ${e.message}`, 'error'); }
  }

  if (!agent) return <div style={{ padding: 40, textAlign: 'center', color: 'var(--muted-fg)', fontSize: 13 }}>Register an agent to track your tasks.</div>;

  const posted = tasks.filter(t => t.poster_id === agent.agent_id);
  const claimed = tasks.filter(t => t.claimer_id === agent.agent_id);
  const list = tab === 'posted' ? posted : claimed;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', flex: 1, overflow: 'hidden' }}>
      <div style={{ display: 'flex', borderBottom: '1px solid var(--border)', flexShrink: 0 }}>
        {[['posted', `Posted (${posted.length})`], ['claimed', `Claimed (${claimed.length})`]].map(([t, l]) => (
          <button key={t} className={`wtab ${tab === t ? 'active' : ''}`} onClick={() => setTab(t)}>{l}</button>
        ))}
      </div>
      {submitId && (
        <div style={{ padding: 12, borderBottom: '1px solid var(--border)', background: 'var(--bg)', flexShrink: 0, display: 'flex', flexDirection: 'column', gap: 8 }}>
          <div style={{ fontSize: 12, fontWeight: 500, color: 'var(--fg)' }}>Submit result for {truncate(submitId, 10)}</div>
          <input className="input" placeholder="Result URI (https://... or ipfs://...)" value={resultUri} onChange={e => setResultUri(e.target.value)} />
          <input className="input" placeholder="Result hash (sha256:...)" value={resultHash} onChange={e => setResultHash(e.target.value)} />
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn-primary" style={{ flex: 1, height: 36 }} onClick={() => submit(submitId)}>Submit</button>
            <button className="btn-ghost" onClick={() => setSubmitId(null)}>Cancel</button>
          </div>
        </div>
      )}
      <div style={{ flex: 1, overflowY: 'auto', padding: 12 }}>
        <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 8 }}>
          <button className="btn-ghost" onClick={load}>Refresh</button>
        </div>
        {loading ? <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>{[...Array(3)].map((_, i) => <Skel key={i} h={56} />)}</div>
         : list.length === 0 ? <div style={{ padding: 32, textAlign: 'center', color: 'var(--muted-fg)', fontSize: 13 }}>No {tab} tasks yet.</div>
         : list.map(task => (
          <div key={task.id} style={{ background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 'var(--radius)', padding: 14, marginBottom: 8 }}>
            <div style={{ fontSize: 14, fontWeight: 500, color: 'var(--fg)', marginBottom: 8, lineHeight: 1.4 }}>{task.title}</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10, flexWrap: 'wrap' }}>
              <span className={`pill ${pillClass(task.status)}`}>
                <span className={`dot ${dotClass(task.status)}`} />
                {statusLabel(task.status)}
              </span>
              <span className="mono" style={{ fontSize: 12, color: 'var(--primary)' }}>{fmtAET(task.budget)}</span>
              {task.claimer_id && tab === 'posted' && <span className="mono" style={{ fontSize: 11, color: 'var(--muted-fg)' }}>claimer: {truncate(task.claimer_id, 8)}</span>}
            </div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              {tab === 'posted' && task.status === 'Submitted' && (
                <>
                  <button className="btn-outline" style={{ flex: 1 }} onClick={() => approve(task.id)}>Approve</button>
                  <button className="btn-danger" style={{ flex: 1 }} onClick={() => dispute(task.id)}>Dispute</button>
                </>
              )}
              {tab === 'claimed' && task.status === 'Claimed' && (
                <button className="btn-primary" style={{ width: '100%', height: 36 }} onClick={() => { setSubmitId(task.id); setResultUri(''); setResultHash(''); }}>Submit Result</button>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function SendPanel({ agent, addToast, initialTo = '' }) {
  const [toAgent, setToAgent] = useState(initialTo);
  const [amount, setAmount] = useState('');
  const [memo, setMemo] = useState('');
  const [sending, setSending] = useState(false);
  const prev = useRef(initialTo);

  useEffect(() => {
    if (initialTo && initialTo !== prev.current) { setToAgent(initialTo); prev.current = initialTo; }
  }, [initialTo]);

  async function send() {
    if (!toAgent.trim()) return addToast('Recipient is required', 'error');
    const amt = parseInt(amount);
    if (!amt || amt <= 0) return addToast('Amount must be > 0', 'error');
    setSending(true);
    try {
      const body = { to_agent: toAgent.trim(), amount: amt, memo: memo.trim(), stake_amount: 1000 };
      if (agent) body.from_agent = agent.agent_id;
      const data = await apiPost('/v1/transfer', body);
      addToast(`Sent ${fmtAET(amt)} \u2014 event ${truncate(data.event_id || data.id || '', 8)}`, 'success');
      setToAgent(''); setAmount(''); setMemo('');
    } catch (e) { addToast(`Transfer failed: ${e.message}`, 'error'); }
    finally { setSending(false); }
  }

  return (
    <div style={{ padding: 20, display: 'flex', flexDirection: 'column', gap: 12 }}>
      {agent && <BalanceWidget agentId={agent.agent_id} />}
      {!agent && <div className="notice">Register an agent to set yourself as sender.</div>}
      <div><label className="field-label">Recipient Agent ID *</label><input className="input" placeholder="Agent ID or name" value={toAgent} onChange={e => setToAgent(e.target.value)} /></div>
      <div>
        <label className="field-label">Amount (\u00b5AET) *</label>
        <input className="input" type="number" min="1" placeholder="1000000" value={amount} onChange={e => setAmount(e.target.value)} />
        {amount && <div className="mono" style={{ fontSize: 12, color: 'var(--muted-fg)', marginTop: 4 }}>= {fmtAET(parseInt(amount) || 0)}</div>}
      </div>
      <div><label className="field-label">Memo</label><input className="input" placeholder="Optional description" value={memo} onChange={e => setMemo(e.target.value)} /></div>
      <button className="btn-primary" style={{ width: '100%' }} onClick={send} disabled={sending}>{sending ? 'Sending\u2026' : 'Send AET'}</button>
    </div>
  );
}

function TasksPage({ agent, addToast, onOpenWallet }) {
  const [tasks, setTasks] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [filter, setFilter] = useState('open');
  const [search, setSearch] = useState('');

  const load = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const d = await apiFetch('/v1/tasks?limit=200');
      setTasks(Array.isArray(d) ? d : (d.tasks || []));
    } catch (e) {
      if (e.message === '501') setError('Task marketplace is not enabled on this node.');
      else addToast('Failed to load tasks', 'error');
    } finally { setLoading(false); }
  }, [addToast]);

  useEffect(() => { load(); }, [load]);

  async function claim(id) {
    if (!agent) { addToast('Register an agent first via Wallet', 'info'); onOpenWallet && onOpenWallet('identity'); return; }
    try { await apiPost(`/v1/tasks/${id}/claim`, { claimer_id: agent.agent_id }); addToast('Task claimed!', 'success'); load(); }
    catch (e) { addToast(`Claim failed: ${e.message}`, 'error'); }
  }

  const FILTERS = ['all', 'open', 'claimed', 'submitted', 'completed', 'disputed'];

  const counts = useMemo(() => {
    const c = { all: tasks.length };
    tasks.forEach(t => { const k = t.status?.toLowerCase(); if (k) c[k] = (c[k] || 0) + 1; });
    return c;
  }, [tasks]);

  const filtered = useMemo(() => {
    return tasks.filter(t => {
      if (filter !== 'all' && t.status?.toLowerCase() !== filter) return false;
      if (search) {
        const s = search.toLowerCase();
        return t.title?.toLowerCase().includes(s) || t.category?.toLowerCase().includes(s) || t.poster_id?.toLowerCase().includes(s);
      }
      return true;
    });
  }, [tasks, filter, search]);

    <div className="container" style={{ paddingTop: 28, paddingBottom: 32 }}>

            <div className="filter-bar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted-fg)" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
              <input placeholder="Search tasks\u2026" value={search} onChange={e => setSearch(e.target.value)} />
              <div style={{ display: 'flex', gap: 2, flexShrink: 0 }}>

                  <button key={f} className={`filter-pill ${filter === f ? 'active' : ''}`} onClick={() => setFilter(f)}>
                    {f === 'all' ? 'All' : statusLabel(f)} {counts[f] != null ? counts[f] : ''}
                  </button>
                ))}
              </div>
            </div>

            <div className="card" style={{ overflow: 'hidden' }}>
              <div style={{ overflowX: 'auto' }}>
                <table>
                  <thead>
                    <tr>

                      <th>Assurance</th>
                      <th>Status</th>

                      ))
                    ) : filtered.length === 0 ? (
                      <tr><td colSpan={6} style={{ padding: 48, textAlign: 'center' }}>
                        <span style={{ color: 'var(--muted-fg)', fontSize: 13 }}>

                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              {filtered.length > 0 && !loading && (
                <div style={{ padding: '8px 20px', fontSize: 12, color: 'var(--muted-fg)', borderTop: '1px solid var(--border)' }}>
                  {filtered.length} task{filtered.length !== 1 ? 's' : ''}{filter !== 'all' ? ` \u00b7 ${statusLabel(filter)}` : ''}
                </div>
              )}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function ValidatorsPage({ agents, loading }) {
  const validators = useMemo(() => [...agents].filter(a => a.staked_amount > 0).sort((a, b) => b.staked_amount - a.staked_amount), [agents]);
  const totalStaked = useMemo(() => validators.reduce((s, v) => s + (v.staked_amount || 0), 0), [validators]);
  const bootstrapMode = validators.length < 20;

  return (
    <div className="container" style={{ paddingTop: 28, paddingBottom: 32 }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
        <div>
          <h2 className="heading" style={{ fontSize: 24, fontWeight: 600 }}>Validators</h2>
          <p style={{ fontSize: 14, color: 'var(--muted-fg)', marginTop: 6, maxWidth: 640, lineHeight: 1.6 }}>
            Validators stake AET to back settlement guarantees. Their slashable stake is the economic security of every assured task.
          </p>
        </div>

        <div className="stat-grid" style={{ gridTemplateColumns: 'repeat(4, 1fr)' }}>
          <StatCard value={loading && !agents.length ? null : String(validators.length)} label="Active" />
          <StatCard value={totalStaked ? fmtAET(totalStaked) : '\u2014'} label="Total Staked" />
          <StatCard value="10,000" label="Min Stake (AET)" />
          <StatCard value={bootstrapMode ? 'Bootstrap' : 'Normal'} label="Phase" />
        </div>

        {bootstrapMode && (
          <div className="notice">
            <strong>Bootstrap Mode</strong> \u2014 Elevated replay rates (40\u201375%) reduce fraud risk while the validator set grows. Bootstrap rewards supplement income. Phase ends when {'\u2265'} 90 days and {'\u2265'} 20 validators.
          </div>
        )}

        {/* Security floor */}
        <div className="card" style={{ overflow: 'hidden' }}>
          <div className="section-header">
            <span className="section-title">Security Floor</span>
          </div>
          <table>
            <thead><tr><th>Lane</th><th>Fee Rate</th><th>Floor</th><th>Min Validators</th><th>Min Budget</th></tr></thead>
            <tbody>
              {[
                { lane: 'Standard', fee: '3%', floor: '2 AET', req: 3, budget: '25 AET', cls: 'lane-std' },
                { lane: 'High', fee: '6%', floor: '4 AET', req: 5, budget: '25 AET', cls: 'lane-high' },
                { lane: 'Enterprise', fee: '8%', floor: '8 AET', req: 10, budget: '25 AET', cls: 'lane-ent' },
                { lane: 'Unassured', fee: '\u2014', floor: '\u2014', req: 0, budget: 'None', cls: 'lane-none' },
              ].map(r => (
                <tr key={r.lane}>
                  <td><span className={`lane-badge ${r.cls}`}>{r.lane}</span></td>
                  <td className="mono" style={{ fontSize: 13 }}>{r.fee}</td>
                  <td className="mono" style={{ fontSize: 13 }}>{r.floor}</td>
                  <td>
                    {r.req > 0 ? (
                      <span className="mono" style={{ fontSize: 13, color: validators.length >= r.req ? 'var(--success)' : 'var(--muted-fg)' }}>
                        {validators.length}/{r.req} {validators.length >= r.req ? 'met' : 'not met'}
                      </span>
                    ) : <span style={{ color: 'var(--muted-fg)' }}>\u2014</span>}
                  </td>
                  <td className="mono" style={{ fontSize: 13 }}>{r.budget}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        {/* Validator table */}
        <div className="card" style={{ overflow: 'hidden' }}>
          <div className="section-header">
            <span className="section-title">Staked Validators</span>
            <span style={{ fontSize: 12, color: 'var(--muted-fg)' }}>{validators.length} of {agents.length} agents</span>
          </div>
          <div style={{ overflowX: 'auto' }}>
            <table>
              <thead><tr><th>#</th><th>Agent ID</th><th>Staked</th><th>Trust Limit</th><th>Reputation</th><th>Tasks</th></tr></thead>
              <tbody>
                {loading && !agents.length ? (
                  [...Array(3)].map((_, i) => <tr key={i}>{[...Array(6)].map((_, j) => <td key={j}><Skel w={60} h={14} /></td>)}</tr>)
                ) : validators.length === 0 ? (
                  <tr><td colSpan={6} style={{ padding: 48, textAlign: 'center' }}><span style={{ color: 'var(--muted-fg)', fontSize: 13 }}>No validators have staked yet.</span></td></tr>
                ) : validators.map((v, i) => (
                  <tr key={v.agent_id}>
                    <td className="mono" style={{ color: 'var(--muted-fg)', fontSize: 13 }}>{i + 1}</td>
                    <td>
                      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                        <span className="dot dot-green" />
                        <CopyId id={v.agent_id} />
                      </span>
                    </td>
                    <td><span className="mono" style={{ color: 'var(--primary)', fontSize: 13 }}>{fmtAET(v.staked_amount)}</span></td>
                    <td><span className="mono" style={{ fontSize: 13 }}>{fmtAET(v.trust_limit)}</span></td>
                    <td><span className="mono" style={{ fontSize: 13 }}>{fmtNum(v.reputation_score)}</span></td>
                    <td><span className="mono" style={{ fontSize: 13 }}>{fmtNum(v.tasks_completed)}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        {/* All agents */}
        {agents.length > 0 && (
          <div className="card" style={{ overflow: 'hidden' }}>
            <div className="section-header">
              <span className="section-title">All Agents</span>
              <span style={{ fontSize: 12, color: 'var(--muted-fg)' }}>{agents.length} registered</span>
            </div>
            <div style={{ overflowX: 'auto' }}>
              <table>
                <thead><tr><th>#</th><th>Agent ID</th><th>Balance</th><th>Reputation</th><th>Tasks</th></tr></thead>
                <tbody>
                  {agents.map(a => (
                    <tr key={a.agent_id}>
                      <td className="mono" style={{ color: 'var(--muted-fg)', fontSize: 13 }}>{a.rank}</td>
                      <td>
                        <CopyId id={a.agent_id} />
                        {a.staked_amount > 0 && <div style={{ fontSize: 11, color: 'var(--primary)', marginTop: 2, opacity: 0.7 }}>Validator</div>}
                      </td>
                      <td><span className="mono" style={{ fontSize: 13 }}>{fmtAET(a.balance)}</span></td>
                      <td><span className="mono" style={{ fontSize: 13 }}>{fmtNum(a.reputation_score)}</span></td>
                      <td><span className="mono" style={{ fontSize: 13 }}>{fmtNum(a.tasks_completed)}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function NetworkPage({ events, dagStats, econ, status, loading }) {
  const total = dagStats?.total_events || 0;
  const byType = dagStats?.events_by_type || {};

  return (
    <div className="container" style={{ paddingTop: 28, paddingBottom: 32 }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
        <h2 className="heading" style={{ fontSize: 24, fontWeight: 600 }}>Network</h2>

        <div className="stat-grid" style={{ gridTemplateColumns: 'repeat(4, 1fr)' }}>
          <StatCard value={status ? fmtNum(total) : null} label="Total Events" />
          <StatCard value={dagStats ? String(dagStats.tips_count ?? 0) : null} label="Tips" />
          <StatCard value={dagStats ? String(dagStats.max_depth ?? 0) : null} label="Max Depth" />
          <StatCard value={status ? String(status.peers) : null} label="Peers" />
        </div>

        <div className="col-2-1" style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 20 }}>
          {/* Event log */}
          <div className="card" style={{ overflow: 'hidden' }}>
            <div className="section-header">
              <span className="section-title">Event Log</span>
              <span style={{ fontSize: 12, color: 'var(--muted-fg)' }}>Last 50</span>
            </div>
            <div style={{ overflowY: 'auto', maxHeight: 600 }}>
              {loading && !events.length ? (
                <div style={{ padding: 20 }}>{[...Array(8)].map((_, i) => <div key={i} style={{ marginBottom: 10 }}><Skel h={20} /></div>)}</div>
              ) : events.length === 0 ? (
                <div style={{ padding: 48, textAlign: 'center', color: 'var(--muted-fg)', fontSize: 13 }}>No events yet.</div>
              ) : (
                <table>
                  <thead><tr><th>ID</th><th>Type</th><th>Details</th><th>State</th></tr></thead>
                  <tbody>
                    {events.map(ev => (
                      <tr key={ev.id}>
                        <td><span className="mono" style={{ fontSize: 12, color: 'var(--muted-fg)' }}>{truncate(ev.id, 8)}</span></td>
                        <td><span style={{ fontSize: 12 }}>{ev.type || 'Unknown'}</span></td>
                        <td>
                          {ev.type === 'Transfer' && ev.from ? (
                            <span className="mono" style={{ fontSize: 12, color: 'var(--muted-fg)' }}>
                              {truncate(ev.from, 6)} {'\u2192'} {truncate(ev.to, 6)} {ev.amount > 0 ? ` ${fmtAET(ev.amount)}` : ''}
                            </span>
                          ) : (
                            <span className="mono" style={{ fontSize: 12, color: 'var(--muted-fg)' }}>
                              {truncate(ev.agent_id, 8)} {ev.causal_timestamp != null ? `ts ${ev.causal_timestamp}` : ''}
                            </span>
                          )}
                        </td>
                        <td>
                          <span className={`pill ${ev.settlement_state === 'Settled' ? 'pill-green' : ev.settlement_state === 'Adjusted' ? 'pill-red' : 'pill-amber'}`}>
                            <span className={`dot ${ev.settlement_state === 'Settled' ? 'dot-green' : ev.settlement_state === 'Adjusted' ? 'dot-red' : 'dot-amber'}`} />
                            {ev.settlement_state}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </div>

          {/* Sidebar */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
            <div className="card" style={{ padding: 20 }}>
              <div className="heading" style={{ fontSize: 14, fontWeight: 600, color: 'var(--fg)', marginBottom: 16 }}>DAG Breakdown</div>
              {Object.keys(byType).length === 0 ? (
                <div style={{ fontSize: 13, color: 'var(--muted-fg)' }}>No events in DAG yet.</div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column' }}>
                  {Object.entries(byType).map(([type, n]) => (
                    <div key={type} className="kv">
                      <span style={{ fontSize: 13, color: 'var(--fg)' }}>{type}</span>
                      <span className="mono" style={{ fontSize: 13, color: 'var(--fg)', fontWeight: 500 }}>{n}</span>
                    </div>
                  ))}
                  <div className="kv" style={{ marginTop: 4 }}>
                    <span style={{ fontSize: 13, color: 'var(--muted-fg)', fontWeight: 500 }}>Total</span>
                    <span className="mono" style={{ fontSize: 13, color: 'var(--fg)', fontWeight: 500 }}>{total}</span>
                  </div>
                </div>
              )}
            </div>

            {econ && (
              <div className="card" style={{ padding: 20 }}>
                <div className="heading" style={{ fontSize: 14, fontWeight: 600, color: 'var(--fg)', marginBottom: 16 }}>Token Economics</div>
                <div style={{ display: 'flex', flexDirection: 'column' }}>
                  {[
                    { k: 'Total Supply', v: fmtAET(econ.total_supply) },
                    { k: 'Circulating', v: fmtAET(econ.circulating_supply) },
                    { k: 'Treasury', v: fmtAET(econ.treasury_balance ?? econ.treasury_accrued) },
                    { k: 'Generated Value', v: fmtAET(econ.total_generated_value) },
                    { k: 'Fee Rate', v: `${econ.fee_basis_points ?? 10} bps` },
                  ].map(row => (
                    <div key={row.k} className="kv">
                      <span style={{ fontSize: 13, color: 'var(--muted-fg)' }}>{row.k}</span>
                      <span className="mono" style={{ fontSize: 13 }}>{row.v}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Header ────────────────────────────────────────────────────── */

function Header({ activePage, onNav, status, agent, onOpenWallet, loading }) {
  const pages = [
    { id: 'overview', l: 'Overview' },
    { id: 'tasks', l: 'Tasks' },
    { id: 'validators', l: 'Validators' },
    { id: 'network', l: 'Network' },
  ];

  return (
    <header className="header">
      <div className="header-inner">
        <button className="logo-btn" onClick={() => onNav('overview')}>
          <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="6" fill="var(--primary)" />
            <path d="M10 22L16 10L22 22H10Z" fill="white" fillOpacity="0.9" />
          </svg>
          AetherNet
          <span style={{ fontSize: 11, fontWeight: 400, color: 'var(--muted-fg)', fontFamily: 'var(--body)' }}>Explorer</span>
        </button>
        <nav className="header-nav">
          {pages.map(p => (
            <button key={p.id} className={`nav-link ${activePage === p.id ? 'active' : ''}`} onClick={() => onNav(p.id)}>{p.l}</button>
          ))}
        </nav>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          {!status && !loading && <span style={{ fontSize: 12, color: 'var(--destructive)' }}>Offline</span>}
          <button className="btn-ghost" onClick={() => onOpenWallet('identity')} style={{ gap: 6 }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><rect x="2" y="6" width="20" height="14" rx="2" /><path d="M2 10h20" /><circle cx="17" cy="14" r="1.5" fill="currentColor" stroke="none" /></svg>
            Wallet
            {agent && <span className="dot dot-green" style={{ width: 5, height: 5 }} />}
          </button>
        </div>
      </div>
    </header>
  );
}

/* ── App ───────────────────────────────────────────────────────── */

function App() {
  const [page, setPage] = useState('overview');
  const [status, setStatus] = useState(null);
  const [events, setEvents] = useState([]);
  const [dagStats, setDagStats] = useState(null);
  const [agents, setAgents] = useState([]);
  const [econ, setEcon] = useState(null);
  const [taskStats, setTaskStats] = useState(null);
  const [recentTasks, setRecentTasks] = useState([]);
  const [networkState, setNetworkState] = useState(null);
  const [loading, setLoading] = useState(true);

  const [walletOpen, setWalletOpen] = useState(false);
  const [walletTab, setWalletTab] = useState('identity');
  const [agent, setAgent] = useState(() => {
    try { return JSON.parse(localStorage.getItem('aethernet_agent')); } catch { return null; }
  });
  const [toasts, addToast] = useToasts();

  const refresh = useCallback(async () => {
    try {
      const [s, ev, st, lb, ec] = await Promise.all([
        apiFetch('/v1/status'),
        apiFetch('/v1/events/recent?limit=50'),
        apiFetch('/v1/dag/stats'),
        apiFetch('/v1/agents/leaderboard?sort=reputation&limit=50'),
        apiFetch('/v1/economics'),
      ]);
      setStatus(s);
      setEvents(Array.isArray(ev) ? ev : []);
      setDagStats(st);
      setAgents(Array.isArray(lb) ? lb : []);
      setEcon(ec);
      apiFetch('/v1/tasks/stats').then(setTaskStats).catch(() => {});
      apiFetch('/v1/tasks?limit=10').then(d => setRecentTasks(Array.isArray(d) ? d.slice(0, 10) : (d.tasks || []).slice(0, 10))).catch(() => {});
      apiFetch('/v1/network/state').then(setNetworkState).catch(() => {});
    } catch (e) {
      console.error('Refresh error:', e);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { refresh(); }, [refresh]);
  useEffect(() => { const id = setInterval(refresh, 5000); return () => clearInterval(id); }, [refresh]);

  function openWallet(tab = 'identity') { setWalletTab(tab); setWalletOpen(true); }

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <Toasts toasts={toasts} />
      <WalletDrawer open={walletOpen} onClose={() => setWalletOpen(false)} initialTab={walletTab} agent={agent} setAgent={setAgent} addToast={addToast} />
      <Header activePage={page} onNav={setPage} status={status} agent={agent} onOpenWallet={openWallet} loading={loading && !status} />

      {!status && !loading && (
        <div className="container" style={{ paddingTop: 16 }}>
          <div style={{ fontSize: 13, color: 'var(--destructive)', padding: '12px 16px', background: 'hsla(0, 84%, 60%, 0.06)', borderRadius: 'var(--radius)', border: '1px solid hsla(0, 84%, 60%, 0.15)' }}>
            Cannot reach node at <span className="mono">{API}</span>. Is the node running?
          </div>
        </div>
      )}

      <main className="page-wrap">
        {page === 'overview' && <OverviewPage status={status} econ={econ} taskStats={taskStats} agents={agents} events={events} dagStats={dagStats} loading={loading} recentTasks={recentTasks} networkState={networkState} onNav={setPage} onOpenWallet={openWallet} />}
        {page === 'tasks' && <TasksPage agent={agent} addToast={addToast} onOpenWallet={openWallet} />}
        {page === 'validators' && <ValidatorsPage agents={agents} loading={loading && !agents.length} />}
        {page === 'network' && <NetworkPage events={events} dagStats={dagStats} econ={econ} status={status} loading={loading} />}
      </main>

      <footer style={{ borderTop: '1px solid var(--border)' }}>
        <div className="container" style={{ padding: '14px 2rem', fontSize: 12, color: 'var(--muted-fg)', display: 'flex', justifyContent: 'space-between' }}>
          <span>AetherNet v0.1.0-testnet{' \u00b7 '}<a href="/docs/" style={{ color: 'var(--muted-fg)', textDecoration: 'none', transition: 'color 0.15s' }} onMouseEnter={e => e.target.style.color = 'var(--fg)'} onMouseLeave={e => e.target.style.color = 'var(--muted-fg)'}>Documentation</a></span>
          <span>Auto-refresh 5s</span>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
