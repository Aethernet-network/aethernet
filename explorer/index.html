<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherNet Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #080D18;
      color: #D8E4F0;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: 'IBM Plex Mono', 'Fira Code', 'Cascadia Code', monospace; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1E2D42; border-radius: 4px; }
    :focus-visible { outline: 2px solid #0D9488; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['IBM Plex Mono', 'Fira Code', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;
const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

// ─── API ──────────────────────────────────────────────────────────────────────
const API = window.location.origin;

async function apiFetch(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function apiPost(path, body) {
  const r = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

// ─── Formatting ───────────────────────────────────────────────────────────────
// 1 AET = 1,000,000 µAET
function fmtAET(uAET) {
  if (uAET == null) return '—';
  const n = Number(uAET);
  if (n >= 1e15) return (n / 1e12).toFixed(0) + 'B AET';
  if (n >= 1e12) return (n / 1e12).toFixed(2) + 'M AET';
  if (n >= 1e9)  return (n / 1e9).toFixed(2) + 'K AET';
  if (n >= 1e6)  return (n / 1e6).toFixed(2) + ' AET';
  if (n >= 1e3)  return (n / 1e3).toFixed(1) + ' mAET';
  return n + ' µAET';
}

function fmtNum(n) {
  if (n == null) return '—';
  const v = Number(n);
  if (v >= 1e9) return (v / 1e9).toFixed(1) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return v.toLocaleString();
}

function fmtScore(n) {
  if (n == null) return '—';
  // Reputation score is 0–1000; display as 0–100
  return (Number(n) / 10).toFixed(1);
}

function trunc(s, n = 14) {
  if (!s) return '—';
  return s.length > n ? s.slice(0, n) + '…' : s;
}

function ago(ns) {
  if (!ns) return '—';
  let ms;
  if (typeof ns === 'string' && (ns.includes('T') || ns.includes('-'))) {
    ms = new Date(ns).getTime();
  } else {
    try { ms = Number(BigInt(String(ns)) / 1000000n); }
    catch { ms = Number(ns) / 1e6; }
  }
  const diff = Date.now() - ms;
  if (diff < 5000)     return 'just now';
  if (diff < 60000)    return Math.floor(diff / 1000) + 's ago';
  if (diff < 3600000)  return Math.floor(diff / 60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
  return Math.floor(diff / 86400000) + 'd ago';
}

function statusLabel(s) {
  return {
    open: 'Open', claimed: 'In progress', submitted: 'Under review',
    completed: 'Settled', disputed: 'Disputed', cancelled: 'Cancelled',
  }[s?.toLowerCase()] || s || '—';
}

function laneLabel(l) {
  return { standard: 'Standard', high_assurance: 'High assurance', enterprise: 'Enterprise' }[l] || 'Unassured';
}

// ─── Status chips ─────────────────────────────────────────────────────────────
const CHIP = {
  // Task status
  open:            'bg-blue-500/10 text-blue-300 border border-blue-500/20',
  'in progress':   'bg-teal-500/10 text-teal-300 border border-teal-500/20',
  claimed:         'bg-teal-500/10 text-teal-300 border border-teal-500/20',
  'under review':  'bg-indigo-400/10 text-indigo-300 border border-indigo-400/20',
  submitted:       'bg-indigo-400/10 text-indigo-300 border border-indigo-400/20',
  settled:         'bg-green-500/10 text-green-300 border border-green-500/20',
  completed:       'bg-green-500/10 text-green-300 border border-green-500/20',
  disputed:        'bg-amber-500/10 text-amber-300 border border-amber-500/20',
  cancelled:       'bg-slate-500/10 text-slate-400 border border-slate-500/20',
  // Validator status
  active:          'bg-green-500/10 text-green-300 border border-green-500/20',
  probationary:    'bg-amber-500/10 text-amber-300 border border-amber-500/20',
  'in probation':  'bg-amber-500/10 text-amber-300 border border-amber-500/20',
  suspended:       'bg-red-500/10 text-red-300 border border-red-500/20',
  cooldown:        'bg-amber-500/10 text-amber-300 border border-amber-500/20',
  slashed:         'bg-red-500/10 text-red-300 border border-red-500/20',
  excluded:        'bg-red-900/30 text-red-400 border border-red-800/30',
  // Replay
  replay_pending:  'bg-indigo-400/10 text-indigo-300 border border-indigo-400/20',
  replay_complete: 'bg-green-500/10 text-green-300 border border-green-500/20',
  replay_disputed: 'bg-red-500/10 text-red-300 border border-red-500/20',
  // Misc
  healthy:         'bg-green-500/10 text-green-300 border border-green-500/20',
  degraded:        'bg-amber-500/10 text-amber-300 border border-amber-500/20',
  bootstrap:       'bg-amber-500/10 text-amber-300 border border-amber-500/20',
  live:            'bg-green-500/10 text-green-300 border border-green-500/20',
  offline:         'bg-slate-500/10 text-slate-400 border border-slate-500/20',
};

function Chip({ label, style: extra }) {
  const cls = extra || CHIP[label?.toLowerCase()] || 'bg-slate-500/10 text-slate-400 border border-slate-500/20';
  return (
    <span className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-medium whitespace-nowrap ${cls}`}>
      {label}
    </span>
  );
}

function StatusChip({ status }) {
  return <Chip label={statusLabel(status)} />;
}

function LaneBadge({ lane }) {
  if (!lane) return <Chip label="Unassured" style={CHIP.cancelled} />;
  const s = {
    standard:       'bg-teal-500/10 text-teal-300 border border-teal-500/20',
    high_assurance: 'bg-blue-500/10 text-blue-300 border border-blue-500/20',
    enterprise:     'bg-indigo-400/10 text-indigo-300 border border-indigo-400/20',
  };
  return <Chip label={laneLabel(lane)} style={s[lane]} />;
}

function ReplayChip({ status }) {
  if (!status) return null;
  const labels = {
    replay_pending:  'Replay pending',
    replay_complete: 'Replay done',
    replay_disputed: 'Replay disputed',
  };
  return <Chip label={labels[status] || status} />;
}

// ─── Layout primitives ────────────────────────────────────────────────────────
function Card({ children, className = '' }) {
  return (
    <div className={`rounded-lg border border-[#1B2A3D] bg-[#0D1624] ${className}`}>
      {children}
    </div>
  );
}

function SectionLabel({ children, action }) {
  return (
    <div className="flex items-center justify-between mb-3">
      <div className="text-xs font-semibold uppercase tracking-wider text-[#3E566E]">
        {children}
      </div>
      {action && <div>{action}</div>}
    </div>
  );
}

// ─── Metric card ──────────────────────────────────────────────────────────────
function Metric({ label, value, sub, mono = false, accent = false }) {
  return (
    <div>
      <div className={`text-2xl font-semibold tracking-tight leading-none mb-1 ${
        accent ? 'text-[#0D9488]' : 'text-[#D8E4F0]'
      } ${mono ? 'font-mono' : ''}`}>
        {value ?? '—'}
      </div>
      <div className="text-xs text-[#5A7490]">{label}</div>
      {sub && <div className="text-xs text-[#3E566E] mt-0.5">{sub}</div>}
    </div>
  );
}

// ─── Event types ──────────────────────────────────────────────────────────────
const EVT = {
  Transfer:     { dot: 'bg-teal-400',   text: 'text-teal-300',   label: 'Transfer' },
  Generation:   { dot: 'bg-indigo-400', text: 'text-indigo-300', label: 'Generation' },
  Verification: { dot: 'bg-blue-400',   text: 'text-blue-300',   label: 'Verification' },
  Attestation:  { dot: 'bg-purple-400', text: 'text-purple-300', label: 'Attestation' },
  Delegation:   { dot: 'bg-slate-400',  text: 'text-slate-300',  label: 'Delegation' },
};

function EventTypeBadge({ type }) {
  const t = EVT[type] || { dot: 'bg-slate-400', text: 'text-slate-300', label: type };
  return (
    <span className={`inline-flex items-center gap-1.5 text-xs font-medium ${t.text}`}>
      <span className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${t.dot}`} />
      {t.label}
    </span>
  );
}

function EventRow({ ev }) {
  let detail = '';
  if (ev.from && ev.to) {
    detail = `${trunc(ev.from, 12)} → ${trunc(ev.to, 12)}`;
    if (ev.amount) detail += `  ${fmtAET(ev.amount)}`;
  } else if (ev.agent_id) {
    detail = trunc(ev.agent_id, 20);
  }
  return (
    <div className="flex items-center gap-3 py-2.5 border-b border-[#111D2C] last:border-0">
      <div className="flex-shrink-0 w-[88px]">
        <EventTypeBadge type={ev.type} />
      </div>
      <div className="flex-1 min-w-0">
        <span className="font-mono text-xs text-[#6BA8C8]">{trunc(ev.id, 18)}</span>
        {detail && <span className="ml-2 text-xs text-[#5A7490]">{detail}</span>}
      </div>
      <div className="flex-shrink-0 text-xs text-[#3E566E] tabular-nums">{ago(ev.causal_timestamp)}</div>
    </div>
  );
}

// ─── Security floor table ─────────────────────────────────────────────────────
function FloorRow({ cat }) {
  const avail = [
    { key: 'standard_available',    label: 'Standard',       floor: cat.floor_standard },
    { key: 'high_available',        label: 'High assurance', floor: cat.floor_high },
    { key: 'enterprise_available',  label: 'Enterprise',     floor: cat.floor_enterprise },
  ];
  return (
    <tr className="border-b border-[#111D2C] last:border-0 hover:bg-[#101826] transition-colors">
      <td className="px-4 py-2.5 font-mono text-xs text-[#6BA8C8]">{cat.name}</td>
      <td className="px-4 py-2.5 text-right font-semibold text-sm text-[#D8E4F0]">{cat.validator_count}</td>
      {avail.map(a => (
        <td key={a.key} className="px-4 py-2.5 text-center">
          {cat[a.key]
            ? <span className="text-green-400 text-xs font-medium">Available</span>
            : <span className="text-[#3E566E] text-xs">Need {a.floor}</span>}
        </td>
      ))}
      <td className="px-4 py-2.5">
        {cat.replay_reserve_healthy !== undefined
          ? <Chip label={cat.replay_reserve_healthy ? 'Healthy' : 'Low'} style={cat.replay_reserve_healthy ? CHIP.healthy : CHIP.degraded} />
          : <span className="text-xs text-[#3E566E]">—</span>}
      </td>
    </tr>
  );
}

function SecurityFloorTable({ categories }) {
  if (!categories?.length) {
    return <div className="text-sm text-[#3E566E] py-4 text-center">No category data available.</div>;
  }
  return (
    <table className="w-full text-sm">
      <thead>
        <tr className="text-xs text-[#3E566E] border-b border-[#1B2A3D]">
          <th className="text-left px-4 py-2 font-medium">Category</th>
          <th className="text-right px-4 py-2 font-medium">Validators</th>
          <th className="text-center px-4 py-2 font-medium">Standard (≥3)</th>
          <th className="text-center px-4 py-2 font-medium">High assurance (≥5)</th>
          <th className="text-center px-4 py-2 font-medium">Enterprise (≥10)</th>
          <th className="text-left px-4 py-2 font-medium">Reserve</th>
        </tr>
      </thead>
      <tbody>
        {categories.map(c => <FloorRow key={c.name} cat={c} />)}
      </tbody>
    </table>
  );
}

// ─── Bootstrap banner ─────────────────────────────────────────────────────────
function BootstrapBanner({ validatorCount }) {
  const needed = Math.max(0, 20 - (validatorCount || 0));
  return (
    <div className="rounded-lg border border-amber-500/25 bg-amber-950/30 px-4 py-3 flex gap-3">
      <div className="flex-shrink-0 mt-0.5 text-amber-400">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0114.082 15H1.918a1.75 1.75 0 01-1.543-2.575zM8 5a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 018 5zm1 7.25a1 1 0 11-2 0 1 1 0 012 0z"/>
        </svg>
      </div>
      <div className="flex-1 min-w-0">
        <div className="text-sm font-semibold text-amber-300 mb-0.5">Bootstrap phase active</div>
        <div className="text-xs text-amber-400/75 leading-relaxed">
          {needed > 0
            ? `The network needs ${needed} more active validator${needed !== 1 ? 's' : ''} (and 90 days of runtime) to exit bootstrap mode. `
            : 'The network has reached the validator threshold but the 90-day duration requirement may still be pending. '}
          Replay rates are elevated (40–75%) and per-task reward supplements apply to accelerate validator calibration and reduce fraud risk.
        </div>
      </div>
      <div className="flex-shrink-0"><Chip label="Bootstrap" /></div>
    </div>
  );
}

// ─── Volume chart ─────────────────────────────────────────────────────────────
function VolumeChart({ buckets }) {
  if (!buckets?.length) {
    return <div className="h-28 flex items-center justify-center text-sm text-[#3E566E]">No activity data</div>;
  }
  const data = buckets.map(b => ({ hour: b.hour, volume: b.volume / 1e6 }));
  return (
    <ResponsiveContainer width="100%" height={112}>
      <BarChart data={data} margin={{ top: 2, right: 0, left: 0, bottom: 0 }}>
        <CartesianGrid vertical={false} stroke="#131E2D" />
        <XAxis dataKey="hour" tick={{ fontSize: 10, fill: '#3E566E', fontFamily: 'inherit' }} tickLine={false} axisLine={false} interval={3} />
        <YAxis hide />
        <Tooltip
          contentStyle={{ background: '#0D1624', border: '1px solid #1B2A3D', borderRadius: 6, fontSize: 11, fontFamily: 'IBM Plex Mono, monospace' }}
          labelStyle={{ color: '#D8E4F0', marginBottom: 2 }}
          formatter={(v) => [v.toFixed(2) + ' AET', 'Volume']}
          cursor={{ fill: 'rgba(13,148,136,0.06)' }}
        />
        <Bar dataKey="volume" fill="#0D9488" radius={[2, 2, 0, 0]} maxBarSize={12} />
      </BarChart>
    </ResponsiveContainer>
  );
}

// ─── Navigation ───────────────────────────────────────────────────────────────
const PAGES = [
  { id: 'overview',   label: 'Overview' },
  { id: 'network',    label: 'Network' },
  { id: 'tasks',      label: 'Tasks' },
  { id: 'validators', label: 'Validators' },
  { id: 'activity',   label: 'Activity' },
];

function Nav({ page, setPage, agent, drawerOpen, setDrawerOpen }) {
  return (
    <nav className="sticky top-0 z-30 border-b border-[#131E2D] bg-[#080D18]/96 backdrop-blur-md">
      <div className="max-w-7xl mx-auto px-4 h-[52px] flex items-center gap-5">
        {/* Wordmark */}
        <div className="flex items-center gap-2 flex-shrink-0 mr-2">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <rect width="22" height="22" rx="5" fill="#0D9488" fillOpacity="0.15"/>
            <rect x="1" y="1" width="20" height="20" rx="4" stroke="#0D9488" strokeOpacity="0.4" strokeWidth="1"/>
            <path d="M6 16L11 6L16 16M8.5 12.5H13.5" stroke="#0D9488" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          <span className="text-sm font-semibold text-[#D8E4F0] tracking-tight">AetherNet</span>
          <span className="text-[10px] font-medium px-1.5 py-0.5 rounded bg-teal-500/10 text-teal-400 border border-teal-500/20 leading-none">testnet</span>
        </div>

        {/* Page tabs */}
        <div className="flex items-center gap-0.5 flex-1">
          {PAGES.map(p => (
            <button
              key={p.id}
              onClick={() => setPage(p.id)}
              className={`px-3 py-1.5 rounded-md text-sm transition-all duration-150 cursor-pointer select-none ${
                page === p.id
                  ? 'bg-[#182636] text-[#D8E4F0] font-medium'
                  : 'text-[#5A7490] hover:text-[#D8E4F0] hover:bg-[#101D2C]'
              }`}
            >
              {p.label}
            </button>
          ))}
        </div>

        {/* Wallet toggle */}
        <button
          onClick={() => setDrawerOpen(o => !o)}
          className={`flex items-center gap-2 px-3 py-1.5 rounded-md text-sm border transition-all duration-150 cursor-pointer select-none ${
            drawerOpen
              ? 'bg-[#182636] border-[#253E56] text-[#D8E4F0]'
              : 'border-[#1B2A3D] text-[#5A7490] hover:text-[#D8E4F0] hover:border-[#253E56] hover:bg-[#101D2C]'
          }`}
        >
          <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
            <path d="M1.5 2A1.5 1.5 0 000 3.5v2h16v-2A1.5 1.5 0 0014.5 2h-13zM16 7H0v6.5A1.5 1.5 0 001.5 15h13a1.5 1.5 0 001.5-1.5V7zm-6 2h2.5a.5.5 0 010 1H10a.5.5 0 010-1z"/>
          </svg>
          {agent
            ? <span className="font-mono text-xs text-[#0D9488]">{trunc(agent.agent_id, 10)}</span>
            : <span>Wallet</span>}
        </button>
      </div>
    </nav>
  );
}

// ─── Toast system ─────────────────────────────────────────────────────────────
function Toast({ toasts }) {
  return (
    <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
      {toasts.map(t => (
        <div key={t.id} className={`px-3.5 py-2.5 rounded-lg text-sm shadow-lg border pointer-events-auto max-w-xs leading-snug ${
          t.type === 'error'   ? 'bg-red-950/90 border-red-800/50 text-red-200' :
          t.type === 'success' ? 'bg-green-950/90 border-green-800/50 text-green-200' :
          'bg-[#0D1624] border-[#1B2A3D] text-[#D8E4F0]'
        }`}>
          {t.message}
        </div>
      ))}
    </div>
  );
}

// ─── Wallet drawer ─────────────────────────────────────────────────────────────
function WalletDrawer({ open, onClose, agent, setAgent, addToast }) {
  const [tab, setTab] = useState('identity');
  const TABS = [
    { id: 'identity', label: 'Identity' },
    { id: 'post',     label: 'Post task' },
    { id: 'mine',     label: 'My tasks' },
    { id: 'send',     label: 'Send' },
  ];

  return (
    <>
      {open && (
        <div
          className="fixed inset-0 z-40 bg-black/40 backdrop-blur-[2px] cursor-pointer"
          onClick={onClose}
          aria-hidden="true"
        />
      )}
      <div
        className={`fixed top-0 right-0 h-full w-[380px] z-50 border-l border-[#131E2D] bg-[#080D18] flex flex-col transition-transform duration-200 ${open ? 'translate-x-0' : 'translate-x-full'}`}
        style={{ boxShadow: open ? '-24px 0 64px rgba(0,0,0,0.5)' : 'none' }}
      >
        <div className="flex items-center justify-between px-4 h-[52px] border-b border-[#131E2D] flex-shrink-0">
          <span className="text-sm font-semibold text-[#D8E4F0]">Wallet</span>
          <button
            onClick={onClose}
            className="text-[#5A7490] hover:text-[#D8E4F0] cursor-pointer p-1.5 rounded-md hover:bg-[#101D2C] transition-colors"
            aria-label="Close wallet"
          >
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M3.72 3.72a.75.75 0 011.06 0L8 6.94l3.22-3.22a.75.75 0 111.06 1.06L9.06 8l3.22 3.22a.75.75 0 11-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 01-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 010-1.06z"/>
            </svg>
          </button>
        </div>
        <div className="flex border-b border-[#131E2D] px-1 flex-shrink-0">
          {TABS.map(t => (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              className={`px-3 py-2.5 text-xs font-medium transition-colors cursor-pointer border-b-2 -mb-px ${
                tab === t.id
                  ? 'border-[#0D9488] text-[#0D9488]'
                  : 'border-transparent text-[#5A7490] hover:text-[#D8E4F0]'
              }`}
            >
              {t.label}
            </button>
          ))}
        </div>
        <div className="flex-1 overflow-y-auto p-4">
          {tab === 'identity' && <IdentityPanel agent={agent} setAgent={setAgent} addToast={addToast} />}
          {tab === 'post' && <PostTaskPanel agent={agent} addToast={addToast} />}
          {tab === 'mine' && <MyTasksPanel agent={agent} addToast={addToast} />}
          {tab === 'send' && <SendPanel agent={agent} addToast={addToast} />}
        </div>
      </div>
    </>
  );
}

// Shared input / label styles
const ifield = 'w-full bg-[#080D18] border border-[#1B2A3D] rounded-md px-3 py-2 text-sm text-[#D8E4F0] placeholder-[#2E4358] focus:outline-none focus:border-[#0D9488] transition-colors';
const flabel = 'text-xs text-[#5A7490] block mb-1.5';

// ─── Identity panel ───────────────────────────────────────────────────────────
function IdentityPanel({ agent, setAgent, addToast }) {
  const [name, setName] = useState('');
  const [loading, setLoading] = useState(false);
  const [balance, setBalance] = useState(null);

  useEffect(() => {
    if (!agent) return;
    apiFetch(`/v1/agents/${encodeURIComponent(agent.agent_id)}/balance`)
      .then(d => setBalance(d.balance))
      .catch(() => {});
  }, [agent?.agent_id]);

  async function register() {
    setLoading(true);
    try {
      const rawKey = new Uint8Array(32);
      window.crypto.getRandomValues(rawKey);
      const pubKeyB64 = btoa(String.fromCharCode(...rawKey));
      const body = { public_key_b64: pubKeyB64 };
      if (name.trim()) body.agent_id = name.trim();
      const data = await apiPost('/v1/agents', body);
      const agentData = { agent_id: data.agent_id, pub_key_b64: pubKeyB64 };
      localStorage.setItem('aethernet_agent', JSON.stringify(agentData));
      setAgent(agentData);
      setName('');
      addToast('Registered: ' + data.agent_id, 'success');
    } catch (e) {
      addToast('Registration failed: ' + e.message, 'error');
    } finally { setLoading(false); }
  }

  if (agent) {
    return (
      <div className="space-y-4">
        <div>
          <div className="text-xs text-[#5A7490] mb-1.5">Agent ID</div>
          <div className="font-mono text-xs text-[#6BA8C8] break-all leading-relaxed bg-[#0A1120] border border-[#1B2A3D] rounded-md px-3 py-2.5">
            {agent.agent_id}
          </div>
        </div>
        {balance != null && (
          <div className="bg-[#0A1120] border border-[#1B2A3D] rounded-md px-3 py-3">
            <div className="text-xs text-[#5A7490] mb-1">Balance</div>
            <div className="text-xl font-semibold text-[#D8E4F0]">{fmtAET(balance)}</div>
            <div className="font-mono text-xs text-[#3E566E] mt-0.5">{Number(balance).toLocaleString()} µAET</div>
          </div>
        )}
        <p className="text-xs text-[#3E566E] leading-relaxed">
          Identity stored in browser localStorage. This is a testnet keypair — the private key equivalent is not stored and signing is not available from the explorer.
        </p>
        <button
          onClick={() => { localStorage.removeItem('aethernet_agent'); setAgent(null); addToast('Identity cleared', 'info'); }}
          className="w-full px-3 py-2 text-sm rounded-md border border-[#1B2A3D] text-[#5A7490] hover:text-[#D8E4F0] hover:border-[#253E56] hover:bg-[#0D1624] transition-colors cursor-pointer"
        >
          Clear identity
        </button>
      </div>
    );
  }

  return (
    <div className="space-y-4">
      <p className="text-xs text-[#5A7490] leading-relaxed">
        Generate a 32-byte keypair in your browser. Your public key becomes your agent identity on the testnet.
      </p>
      <div>
        <label className={flabel}>Display name <span className="text-[#2E4358]">(optional)</span></label>
        <input className={ifield} placeholder="e.g. my-research-agent" value={name}
          onChange={e => setName(e.target.value)} onKeyDown={e => e.key === 'Enter' && register()} />
      </div>
      <button
        onClick={register} disabled={loading}
        className="w-full px-3 py-2 text-sm rounded-md bg-[#0D9488] hover:bg-[#0C857A] text-white font-medium transition-colors cursor-pointer disabled:opacity-50"
      >
        {loading ? 'Registering…' : 'Generate keypair & register'}
      </button>
    </div>
  );
}

// ─── Post task panel ──────────────────────────────────────────────────────────
function PostTaskPanel({ agent, addToast }) {
  const [form, setForm] = useState({ title: '', description: '', category: '', budget: '', lane: '' });
  const [loading, setLoading] = useState(false);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  async function postTask() {
    if (!agent) return addToast('Register an agent first', 'error');
    if (!form.title.trim()) return addToast('Title is required', 'error');
    const budget = parseInt(form.budget, 10);
    if (!budget || budget < 100000) return addToast('Minimum budget: 0.1 AET (100,000 µAET)', 'error');
    setLoading(true);
    try {
      const body = {
        poster_id: agent.agent_id,
        title: form.title.trim(),
        description: form.description.trim(),
        category: form.category.trim() || 'general',
        budget,
        ...(form.lane && { contract: { assurance_lane: form.lane } }),
      };
      await apiPost('/v1/tasks', body);
      setForm({ title: '', description: '', category: '', budget: '', lane: '' });
      addToast('Task posted', 'success');
    } catch (e) {
      addToast('Failed: ' + e.message, 'error');
    } finally { setLoading(false); }
  }

  return (
    <div className="space-y-3">
      <div><label className={flabel}>Title</label><input className={ifield} placeholder="What should the agent do?" value={form.title} onChange={e => set('title', e.target.value)} /></div>
      <div><label className={flabel}>Description</label><textarea className={ifield} style={{ resize: 'vertical' }} rows={3} placeholder="Acceptance criteria, constraints…" value={form.description} onChange={e => set('description', e.target.value)} /></div>
      <div><label className={flabel}>Category</label><input className={ifield} placeholder="code, research, writing…" value={form.category} onChange={e => set('category', e.target.value)} /></div>
      <div>
        <label className={flabel}>Budget <span className="text-[#2E4358]">(µAET, min 100,000)</span></label>
        <input className={ifield} type="number" placeholder="e.g. 1000000 = 1 AET" value={form.budget} onChange={e => set('budget', e.target.value)} />
      </div>
      <div>
        <label className={flabel}>Assurance lane</label>
        <select className={ifield + ' cursor-pointer'} value={form.lane} onChange={e => set('lane', e.target.value)}>
          <option value="">Unassured (no verification fee)</option>
          <option value="standard">Standard — 3% fee, 3 validators required</option>
          <option value="high_assurance">High assurance — 6% fee, 5 validators required</option>
          <option value="enterprise">Enterprise — 8% fee, 10 validators required</option>
        </select>
      </div>
      <button onClick={postTask} disabled={loading}
        className="w-full px-3 py-2 text-sm rounded-md bg-[#0D9488] hover:bg-[#0C857A] text-white font-medium transition-colors cursor-pointer disabled:opacity-50">
        {loading ? 'Posting…' : 'Post task'}
      </button>
    </div>
  );
}

// ─── My tasks panel ───────────────────────────────────────────────────────────
function MyTasksPanel({ agent, addToast }) {
  const [tasks, setTasks] = useState([]);
  const [loading, setLoading] = useState(false);
  const [subtab, setSubtab] = useState('posted');

  const reload = useCallback(() => {
    if (!agent) return;
    apiFetch(`/v1/tasks/agent/${encodeURIComponent(agent.agent_id)}`).then(setTasks).catch(() => setTasks([]));
  }, [agent?.agent_id]);

  useEffect(() => {
    setLoading(true);
    reload();
    setLoading(false);
  }, [reload]);

  const posted = tasks.filter(t => t.poster_id === agent?.agent_id);
  const claimed = tasks.filter(t => t.claimer_id === agent?.agent_id);
  const shown = subtab === 'posted' ? posted : claimed;

  async function act(taskId, action) {
    try {
      await apiPost(`/v1/tasks/${taskId}/${action}`, { approver_id: agent?.agent_id, poster_id: agent?.agent_id });
      addToast(action + ' successful', 'success');
      reload();
    } catch (e) { addToast(action + ' failed: ' + e.message, 'error'); }
  }

  if (!agent) return <div className="text-sm text-[#3E566E]">Register an agent to see tasks.</div>;
  if (loading) return <div className="text-sm text-[#3E566E]">Loading…</div>;

  return (
    <div className="space-y-3">
      <div className="flex gap-1 bg-[#0A1120] border border-[#1B2A3D] rounded-md p-1">
        {[['posted', 'Posted'], ['claimed', 'Claimed']].map(([id, lbl]) => (
          <button key={id} onClick={() => setSubtab(id)}
            className={`flex-1 py-1 text-xs rounded transition-colors cursor-pointer font-medium ${
              subtab === id ? 'bg-[#182636] text-[#D8E4F0]' : 'text-[#5A7490] hover:text-[#D8E4F0]'
            }`}>
            {lbl}
          </button>
        ))}
      </div>
      {shown.length === 0
        ? <div className="text-sm text-[#3E566E] py-4 text-center">No {subtab} tasks.</div>
        : shown.map(t => (
          <div key={t.id} className="bg-[#0A1120] border border-[#1B2A3D] rounded-md p-3 space-y-2">
            <div className="text-sm font-medium text-[#D8E4F0] truncate">{t.title || trunc(t.id)}</div>
            <div className="flex items-center gap-2">
              <StatusChip status={t.status} />
              <span className="font-mono text-xs text-[#3E566E]">{fmtAET(t.budget)}</span>
            </div>
            {subtab === 'posted' && t.status === 'submitted' && (
              <div className="flex gap-2">
                <button onClick={() => act(t.id, 'approve')} className="flex-1 py-1.5 text-xs rounded-md bg-green-900/30 text-green-300 hover:bg-green-900/50 transition-colors cursor-pointer font-medium">Approve</button>
                <button onClick={() => act(t.id, 'dispute')} className="flex-1 py-1.5 text-xs rounded-md bg-amber-900/30 text-amber-300 hover:bg-amber-900/50 transition-colors cursor-pointer font-medium">Dispute</button>
              </div>
            )}
            {subtab === 'posted' && t.status === 'open' && (
              <button onClick={() => act(t.id, 'cancel')} className="w-full py-1.5 text-xs rounded-md border border-[#1B2A3D] text-[#5A7490] hover:text-[#D8E4F0] transition-colors cursor-pointer">Cancel</button>
            )}
            {subtab === 'claimed' && t.status === 'claimed' && (
              <SubmitResult taskId={t.id} agentId={agent.agent_id} addToast={addToast} onDone={reload} />
            )}
          </div>
        ))}
    </div>
  );
}

function SubmitResult({ taskId, agentId, addToast, onDone }) {
  const [f, setF] = useState({ hash: '', note: '', uri: '' });
  async function submit() {
    try {
      await apiPost(`/v1/tasks/${taskId}/submit`, { claimer_id: agentId, result_hash: f.hash, result_note: f.note, result_uri: f.uri });
      addToast('Result submitted', 'success');
      onDone();
    } catch (e) { addToast('Submit failed: ' + e.message, 'error'); }
  }
  const inp = 'w-full bg-[#080D18] border border-[#1B2A3D] rounded px-2 py-1.5 text-xs text-[#D8E4F0] placeholder-[#2E4358] focus:outline-none focus:border-[#0D9488] transition-colors';
  return (
    <div className="space-y-1.5">
      <input className={inp} placeholder="Result hash (sha256:…)" value={f.hash} onChange={e => setF(v => ({...v, hash: e.target.value}))} />
      <input className={inp} placeholder="Summary note" value={f.note} onChange={e => setF(v => ({...v, note: e.target.value}))} />
      <input className={inp} placeholder="Result URI (optional)" value={f.uri} onChange={e => setF(v => ({...v, uri: e.target.value}))} />
      <button onClick={submit} className="w-full py-1.5 text-xs rounded-md bg-[#0D9488]/15 text-[#0D9488] hover:bg-[#0D9488]/25 transition-colors cursor-pointer font-medium border border-[#0D9488]/20">
        Submit result
      </button>
    </div>
  );
}

// ─── Send panel ───────────────────────────────────────────────────────────────
function SendPanel({ agent, addToast }) {
  const [form, setForm] = useState({ to: '', amount: '', memo: '' });
  const [loading, setLoading] = useState(false);

  async function send() {
    if (!agent) return addToast('Register an agent first', 'error');
    if (!form.to.trim()) return addToast('Recipient required', 'error');
    const amount = parseInt(form.amount, 10);
    if (!amount || amount < 1) return addToast('Amount must be positive', 'error');
    setLoading(true);
    try {
      await apiPost('/v1/transfer', { to_agent: form.to.trim(), amount, memo: form.memo.trim() });
      setForm({ to: '', amount: '', memo: '' });
      addToast('Sent ' + fmtAET(amount), 'success');
    } catch (e) {
      addToast('Transfer failed: ' + e.message, 'error');
    } finally { setLoading(false); }
  }

  return (
    <div className="space-y-3">
      <div><label className={flabel}>Recipient agent ID</label><input className={ifield} placeholder="Agent ID" value={form.to} onChange={e => setForm(f => ({...f, to: e.target.value}))} /></div>
      <div><label className={flabel}>Amount (µAET)</label><input className={ifield} type="number" placeholder="e.g. 1000000 = 1 AET" value={form.amount} onChange={e => setForm(f => ({...f, amount: e.target.value}))} /></div>
      <div><label className={flabel}>Memo <span className="text-[#2E4358]">(optional)</span></label><input className={ifield} placeholder="Optional" value={form.memo} onChange={e => setForm(f => ({...f, memo: e.target.value}))} /></div>
      <button onClick={send} disabled={loading}
        className="w-full px-3 py-2 text-sm rounded-md bg-[#0D9488] hover:bg-[#0C857A] text-white font-medium transition-colors cursor-pointer disabled:opacity-50">
        {loading ? 'Sending…' : 'Send'}
      </button>
    </div>
  );
}

// ─── Overview page ────────────────────────────────────────────────────────────

    return c;
  }, [tasks]);

  const settled24h = useMemo(() => {

  const bootstrapActive = networkState?.bootstrap_active ?? ((agents?.filter(a => a.staked_amount > 0).length || 0) < 20);

                </span>

      {/* Key metrics */}

        <SectionLabel>Network at a glance</SectionLabel>
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
          <Card className="px-4 py-4"><Metric label="Open tasks" value={fmtNum(counts.open || 0)} /></Card>
          <Card className="px-4 py-4"><Metric label="Settled (24h)" value={fmtNum(settled24h)} /></Card>
          <Card className="px-4 py-4"><Metric label="Active validators" value={fmtNum(activeValidators)} /></Card>

                  <td className="px-4 py-2.5 text-right text-xs text-[#5A7490]">{row.budget}</td>
                  <td className="px-4 py-2.5 pl-4 text-xs text-[#3E566E]">{row.note}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="px-4 py-2.5 border-t border-[#131E2D] text-xs text-[#3E566E]">
            Fee formula: <code className="font-mono">fee = max(floor, rate × budget)</code>. Assurance fee is in addition to the 0.1% base protocol fee.
          </div>
        </Card>
      </div>

      {/* Event feed */}
      <div>
        <SectionLabel>Recent events</SectionLabel>
        <Card>
          <div className="px-4 py-0.5">
            {(events || []).slice(0, 20).map(ev => <EventRow key={ev.id} ev={ev} />)}
            {(!events || events.length === 0) && <div className="py-8 text-center text-sm text-[#3E566E]">No events.</div>}
          </div>
        </Card>
      </div>
    </div>
  );
}

// ─── Tasks page ───────────────────────────────────────────────────────────────
function TasksPage({ tasks }) {
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [page, setPage] = useState(0);
  const PAGE_SIZE = 25;

  const FILTERS = [
    { id: 'all',       label: 'All' },
    { id: 'open',      label: 'Open' },
    { id: 'claimed',   label: 'In progress' },
    { id: 'submitted', label: 'Under review' },
    { id: 'completed', label: 'Settled' },
    { id: 'disputed',  label: 'Disputed' },
    { id: 'cancelled', label: 'Cancelled' },
  ];

  const filtered = useMemo(() => {
    let ts = tasks || [];
    if (filter !== 'all') ts = ts.filter(t => t.status?.toLowerCase() === filter);
    if (search.trim()) {
      const q = search.toLowerCase();
      ts = ts.filter(t =>
        (t.title || '').toLowerCase().includes(q) ||
        (t.category || '').toLowerCase().includes(q) ||
        (t.poster_id || '').toLowerCase().includes(q) ||
        (t.id || '').toLowerCase().includes(q)
      );
    }
    return ts;
  }, [tasks, filter, search]);

  const paged = filtered.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);

  const counts = useMemo(() => {
    const c = {};
    (tasks || []).forEach(t => { const s = t.status?.toLowerCase() || 'unknown'; c[s] = (c[s] || 0) + 1; });
    return c;
  }, [tasks]);

  const STATUS_STATS = [
    { key: 'open',      label: 'Open' },
    { key: 'claimed',   label: 'In progress' },
    { key: 'submitted', label: 'Under review' },
    { key: 'completed', label: 'Settled' },
    { key: 'disputed',  label: 'Disputed' },
    { key: 'cancelled', label: 'Cancelled' },
  ];

  return (
    <div className="space-y-6">
      <div>
        <h2 className="text-xl font-semibold text-[#D8E4F0] mb-1">Tasks</h2>
        <p className="text-sm text-[#5A7490]">
          Work items posted to the marketplace. Assured tasks require independent verification before payment settles.
        </p>
      </div>

      {/* Stats bar */}
      <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">
        {STATUS_STATS.map(s => (
          <button
            key={s.key}
            onClick={() => { setFilter(s.key); setPage(0); }}
            className={`rounded-lg border px-3 py-3 text-left cursor-pointer transition-all duration-150 ${
              filter === s.key
                ? 'border-[#0D9488]/50 bg-[#0D9488]/8 ring-1 ring-[#0D9488]/20'
                : 'border-[#1B2A3D] bg-[#0D1624] hover:border-[#253E56]'
            }`}
            style={filter === s.key ? { backgroundColor: 'rgba(13,148,136,0.07)' } : {}}
          >
            <div className={`text-xl font-semibold ${filter === s.key ? 'text-[#0D9488]' : 'text-[#D8E4F0]'}`}>
              {counts[s.key] || 0}
            </div>
            <div className="text-xs text-[#5A7490] mt-0.5">{s.label}</div>
          </button>
        ))}
      </div>

      {/* Filter + search */}
      <div className="flex flex-wrap items-center gap-2">
        <div className="flex gap-1 flex-wrap">
          {FILTERS.map(f => (
            <button
              key={f.id}
              onClick={() => { setFilter(f.id); setPage(0); }}
              className={`px-3 py-1 rounded-full text-xs font-medium transition-all duration-150 cursor-pointer border ${
                filter === f.id
                  ? 'bg-[#0D9488]/12 text-[#0D9488] border-[#0D9488]/30'
                  : 'text-[#5A7490] hover:text-[#D8E4F0] border-[#1B2A3D] hover:border-[#253E56]'
              }`}
              style={filter === f.id ? { backgroundColor: 'rgba(13,148,136,0.09)' } : {}}
            >
              {f.label}
            </button>
          ))}
        </div>
        <div className="flex-1 min-w-[200px]">
          <input
            className="w-full bg-[#0D1624] border border-[#1B2A3D] rounded-lg px-3 py-1.5 text-sm text-[#D8E4F0] placeholder-[#2E4358] focus:outline-none focus:border-[#0D9488] transition-colors"
            placeholder="Search title, category, ID…"
            value={search}
            onChange={e => { setSearch(e.target.value); setPage(0); }}
          />
        </div>
      </div>

      {/* Task table */}
      <Card className="overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-xs text-[#3E566E] border-b border-[#1B2A3D]">
                <th className="text-left px-4 py-2.5 font-medium">Task</th>
                <th className="text-left px-4 py-2.5 font-medium">Category</th>
                <th className="text-left px-4 py-2.5 font-medium">Assurance</th>
                <th className="text-left px-4 py-2.5 font-medium">Status</th>
                <th className="text-right px-4 py-2.5 font-medium">Budget</th>
                <th className="text-right px-4 py-2.5 font-medium">Net payout</th>
                <th className="text-right px-4 py-2.5 font-medium">Replay</th>
                <th className="text-right px-4 py-2.5 font-medium">Posted</th>
              </tr>
            </thead>
            <tbody>
              {paged.length === 0 && (
                <tr>
                  <td colSpan={8} className="px-4 py-10 text-center text-sm text-[#3E566E]">
                    No tasks match your filter.
                  </td>
                </tr>
              )}
              {paged.map(t => (
                <tr key={t.id} className="border-b border-[#111D2C] last:border-0 hover:bg-[#0F1E2D] transition-colors">
                  <td className="px-4 py-2.5 max-w-[200px]">
                    <div className="font-medium text-[#D8E4F0] truncate">{t.title || '—'}</div>
                    <div className="font-mono text-[11px] text-[#3E566E] mt-0.5">{trunc(t.id, 18)}</div>
                  </td>
                  <td className="px-4 py-2.5">
                    <span className="font-mono text-xs text-[#6BA8C8]">{t.category || '—'}</span>
                  </td>
                  <td className="px-4 py-2.5"><LaneBadge lane={t.contract?.assurance_lane} /></td>
                  <td className="px-4 py-2.5"><StatusChip status={t.status} /></td>
                  <td className="px-4 py-2.5 text-right font-mono text-xs text-[#6BA8C8]">{fmtAET(t.budget)}</td>
                  <td className="px-4 py-2.5 text-right font-mono text-xs text-[#5A7490]">
                    {t.worker_net_payout ? fmtAET(t.worker_net_payout) : '—'}
                  </td>
                  <td className="px-4 py-2.5 text-right">
                    {t.replay_status ? <ReplayChip status={t.replay_status} /> : <span className="text-xs text-[#2E4358]">—</span>}
                  </td>
                  <td className="px-4 py-2.5 text-right text-xs text-[#3E566E] tabular-nums">{ago(t.posted_at)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {totalPages > 1 && (
          <div className="px-4 py-2.5 border-t border-[#1B2A3D] flex items-center justify-between">
            <span className="text-xs text-[#3E566E]">{filtered.length} tasks · page {page + 1} of {totalPages}</span>
            <div className="flex gap-2">
              <button disabled={page === 0} onClick={() => setPage(p => p - 1)}
                className="px-3 py-1 text-xs rounded border border-[#1B2A3D] text-[#5A7490] hover:text-[#D8E4F0] disabled:opacity-30 cursor-pointer transition-colors">
                Previous
              </button>
              <button disabled={page >= totalPages - 1} onClick={() => setPage(p => p + 1)}
                className="px-3 py-1 text-xs rounded border border-[#1B2A3D] text-[#5A7490] hover:text-[#D8E4F0] disabled:opacity-30 cursor-pointer transition-colors">
                Next
              </button>
            </div>
          </div>
        )}
      </Card>
    </div>
  );
}

        <SectionLabel>Assignment weights</SectionLabel>
        <Card className="overflow-hidden">
          <table className="w-full text-sm">
            <thead>

        </Card>
      </div>
    </div>
  );
}

// ─── Activity page ────────────────────────────────────────────────────────────
function ActivityPage({ events, dagStats, economics }) {
  const TYPE_ORDER = ['Transfer', 'Generation', 'Verification', 'Attestation', 'Delegation'];
  const byType = dagStats?.events_by_type || {};
  const total = Object.values(byType).reduce((s, v) => s + v, 0) || 1;

  return (
    <div className="space-y-8">
      <div>
        <h2 className="text-xl font-semibold text-[#D8E4F0] mb-1">Activity</h2>
        <p className="text-sm text-[#5A7490]">
          Live event stream from the causal DAG. Each event is a first-class participant with cryptographic causal references.
        </p>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
        {/* Event stream — 2/3 width */}
        <div className="lg:col-span-2">
          <SectionLabel>Event stream</SectionLabel>
          <Card>
            <div className="px-4 py-0.5">
              {(events || []).slice(0, 50).map(ev => <EventRow key={ev.id} ev={ev} />)}
              {(!events || events.length === 0) && (
                <div className="py-10 text-center text-sm text-[#3E566E]">No events yet.</div>
              )}
            </div>
          </Card>
        </div>

        {/* Right column */}
        <div className="space-y-6">
          {/* DAG breakdown */}
          <div>
            <SectionLabel>DAG breakdown</SectionLabel>
            <Card className="p-4 space-y-3.5">
              {TYPE_ORDER.map(type => {
                const count = byType[type] || 0;
                const pct = Math.round((count / total) * 100);
                const t = EVT[type] || { dot: 'bg-slate-400', text: 'text-slate-300' };
                return (
                  <div key={type}>
                    <div className="flex justify-between text-xs mb-1.5">
                      <span className={t.text}>{type}</span>
                      <span className="font-mono text-[#6BA8C8]">
                        {count.toLocaleString()} <span className="text-[#3E566E]">({pct}%)</span>
                      </span>
                    </div>
                    <div className="h-1 bg-[#0D1220] rounded-full overflow-hidden">
                      <div className={`h-full rounded-full transition-all ${t.dot}`} style={{ width: Math.max(pct, pct > 0 ? 2 : 0) + '%' }} />
                    </div>
                  </div>
                );
              })}
              {dagStats && (
                <div className="pt-1 border-t border-[#131E2D] text-xs text-[#3E566E]">
                  <div className="flex justify-between mb-1">
                    <span>Total events</span>
                    <span className="font-mono text-[#6BA8C8]">{(dagStats.total_events || 0).toLocaleString()}</span>
                  </div>
                  <div className="flex justify-between mb-1">
                    <span>DAG tips</span>
                    <span className="font-mono text-[#6BA8C8]">{dagStats.tips_count || 0}</span>
                  </div>
                  <div className="flex justify-between">
                    <span>Max depth</span>
                    <span className="font-mono text-[#6BA8C8]">{dagStats.max_depth || 0}</span>
                  </div>
                </div>
              )}
            </Card>
          </div>

          {/* Economics */}
          <div>
            <SectionLabel>Token economics</SectionLabel>
            <Card className="p-4">
              {[
                { label: 'Total supply',     value: fmtAET(economics?.total_supply) },
                { label: 'Circulating',      value: fmtAET(economics?.circulating_supply) },
                { label: 'Treasury balance', value: fmtAET(economics?.treasury_balance) },
                { label: 'Generated value',  value: fmtAET(economics?.total_generated_value) },
                { label: 'Onboarding pool',  value: fmtAET(economics ? (economics.onboarding_pool_total - economics.onboarding_allocated) : null) },
                { label: 'Protocol fee',     value: economics?.fee_basis_points ? (economics.fee_basis_points / 100).toFixed(2) + '%' : '—' },
              ].map(row => (
                <div key={row.label} className="flex justify-between items-baseline py-1.5 border-b border-[#111D2C] last:border-0">
                  <span className="text-xs text-[#5A7490]">{row.label}</span>
                  <span className="font-mono text-xs text-[#6BA8C8]">{row.value}</span>
                </div>
              ))}
            </Card>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── App root ─────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('overview');
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [agent, setAgent] = useState(() => {
    try { return JSON.parse(localStorage.getItem('aethernet_agent')); } catch { return null; }
  });
  const [toasts, setToasts] = useState([]);

  // Data
  const [status, setStatus]         = useState(null);
  const [economics, setEconomics]   = useState(null);
  const [agents, setAgents]         = useState([]);
  const [tasks, setTasks]           = useState([]);
  const [events, setEvents]         = useState([]);
  const [activityData, setActivity] = useState(null);
  const [dagStats, setDagStats]     = useState(null);
  const [networkState, setNetState] = useState(null);

  function addToast(message, type = 'info') {
    const id = Date.now() + Math.random();
    setToasts(ts => [...ts, { id, message, type }]);
    setTimeout(() => setToasts(ts => ts.filter(t => t.id !== id)), 4000);
  }

  const fetchAll = useCallback(async () => {
    const [s, e, a, t, ev, act, dag, ns] = await Promise.allSettled([
      apiFetch('/v1/status'),
      apiFetch('/v1/economics'),
      apiFetch('/v1/agents/leaderboard?limit=100'),
      apiFetch('/v1/tasks?limit=200'),
      apiFetch('/v1/events/recent?limit=50'),
      apiFetch('/v1/network/activity?hours=24'),
      apiFetch('/v1/dag/stats'),
      apiFetch('/v1/network/state'),
    ]);
    if (s.status === 'fulfilled')   setStatus(s.value);
    if (e.status === 'fulfilled')   setEconomics(e.value);
    if (a.status === 'fulfilled')   setAgents(Array.isArray(a.value) ? a.value : []);
    if (t.status === 'fulfilled')   setTasks(Array.isArray(t.value) ? t.value : []);
    if (ev.status === 'fulfilled')  setEvents(Array.isArray(ev.value) ? ev.value : []);
    if (act.status === 'fulfilled') setActivity(act.value);
    if (dag.status === 'fulfilled') setDagStats(dag.value);
    if (ns.status === 'fulfilled')  setNetState(ns.value);
  }, []);

  useEffect(() => {
    fetchAll();
    const id = setInterval(fetchAll, 5000);
    return () => clearInterval(id);
  }, [fetchAll]);

  const shared = { status, economics, agents, tasks, events, activityData, dagStats, networkState };

  return (
    <div className="min-h-screen bg-[#080D18]">
      <Nav page={page} setPage={setPage} agent={agent} drawerOpen={drawerOpen} setDrawerOpen={setDrawerOpen} />
      <main className="max-w-7xl mx-auto px-4 py-8">
        {page === 'overview'    && <OverviewPage   {...shared} />}
        {page === 'network'     && <NetworkPage    {...shared} />}
        {page === 'tasks'       && <TasksPage tasks={tasks} />}
        {page === 'validators'  && <ValidatorsPage agents={agents} networkState={networkState} />}
        {page === 'activity'    && <ActivityPage events={events} dagStats={dagStats} economics={economics} />}
      </main>
      <WalletDrawer open={drawerOpen} onClose={() => setDrawerOpen(false)} agent={agent} setAgent={setAgent} addToast={addToast} />
      <Toast toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
