[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aethernet-sdk"
version = "0.2.0"
description = "Python SDK for the AetherNet protocol — verified AI work settlement"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "AetherNet Labs"}
]
keywords = ["aethernet", "ai", "agents", "verification", "settlement", "protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
    "pynacl>=1.5.0",
]

[project.optional-dependencies]
agents = [
    "anthropic>=0.25.0",
]
langchain = [
    "langchain-core>=0.1.0",
]
crewai = [
    "crewai>=0.1.0",
]
openai = [
    "openai-agents>=0.1.0",
]
dev = [
    "pytest>=7.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://aethernet.network"
Repository = "https://github.com/Aethernet-network/aethernet"
Documentation = "https://github.com/Aethernet-network/aethernet/blob/main/docs/quickstart.md"
Issues = "https://github.com/Aethernet-network/aethernet/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["aethernet*"]
